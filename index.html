<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0A192F">
<title>نخبة 2AS | منصة تسيير واقتصاد</title>
<meta name="description" content="منصة تعليمية مجانية لطلاب السنة الثانية ثانوي شعبة تسيير واقتصاد في الجزائر">

<!-- PWA Manifest Inline -->
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D9%86%D8%AE%D8%A8%D8%A9%202AS%22%2C%22short_name%22%3A%22NOKHBA%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230A192F%22%2C%22theme_color%22%3A%22%2310B981%22%2C%22dir%22%3A%22rtl%22%2C%22lang%22%3A%22ar%22%7D">

<!-- Favicon SVG -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A192F'/%3E%3Cpath d='M30 70 L30 30 L50 50 L70 30 L70 70' stroke='%2310B981' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0A192F;
  --navy-light: #112240;
  --navy-dark: #020c1b;
  --emerald: #10B981;
  --emerald-light: #34D399;
  --emerald-dark: #059669;
  --sand: #F8FAFC;
  --text: #1E293B;
  --text-light: #64748B;
  --border: #E2E8F0;
  --shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1);
  --radius: 12px;
}

[data-theme="dark"] {
  --sand: #0F172A;
  --text: #F1F5F9;
  --text-light: #94A3B8;
  --border: #1E293B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans Arabic', 'Cairo', sans-serif;
  background: var(--sand);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  direction: rtl;
  min-height: 100vh;
  transition: background .3s;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--sand); }
::-webkit-scrollbar-thumb { background: var(--navy); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--emerald); }

button { font-family: inherit; cursor: pointer; border: none; }
input, textarea, select { font-family: inherit; }

/* Layout */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  background: var(--navy);
  color: white;
  padding: 1.5rem 1rem;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.logo {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 0 .75rem 1.5rem;
  border-bottom: 1px solid rgba(255,255,255,.1);
  margin-bottom: 1.5rem;
}

.logo-icon {
  width: 44px; height: 44px;
  background: var(--emerald);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.5rem; color: var(--navy);
}

.logo-text h1 { font-size: 1.1rem; font-weight: 800; }
.logo-text p { font-size: .75rem; color: #94A3B8; }

.nav-item {
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1rem;
  margin-bottom: .25rem;
  border-radius: 10px;
  color: #CBD5E1;
  font-size: .95rem;
  font-weight: 500;
  transition: all .2s;
  cursor: pointer;
  background: transparent;
  width: 100%;
  text-align: right;
  border: none;
}

.nav-item:hover { background: var(--navy-light); color: white; }
.nav-item.active { background: var(--emerald); color: var(--navy); font-weight: 700; }

.nav-icon { width: 20px; height: 20px; flex-shrink: 0; }

.sidebar-footer {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid rgba(255,255,255,.1);
  font-size: .8rem;
  color: #64748B;
  text-align: center;
}

/* Main */
.main {
  padding: 2rem;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.search-box {
  flex: 1;
  max-width: 400px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: .75rem 2.75rem .75rem 1rem;
  border: 1px solid var(--border);
  background: white;
  border-radius: 10px;
  font-size: .95rem;
  outline: none;
  transition: border .2s;
}

[data-theme="dark"] .search-box input { background: var(--navy-light); color: white; }

.search-box input:focus { border-color: var(--emerald); }

.search-icon {
  position: absolute;
  right: .75rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-light);
}

.top-actions { display: flex; gap: .5rem; align-items: center; }

.icon-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: white;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--navy);
  transition: all .2s;
}

[data-theme="dark"] .icon-btn { background: var(--navy-light); color: white; }

.icon-btn:hover { background: var(--emerald); color: white; border-color: var(--emerald); }

/* Page Title */
.page-title {
  margin-bottom: 2rem;
}
.page-title h2 {
  font-size: 2rem;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: .5rem;
}
[data-theme="dark"] .page-title h2 { color: white; }
.page-title p { color: var(--text-light); font-size: 1rem; }

/* Cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.25rem;
  margin-bottom: 2rem;
}

.card {
  background: white;
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: all .2s;
  cursor: pointer;
}

[data-theme="dark"] .card { background: var(--navy-light); }

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--emerald);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.card-icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
  display: flex; align-items: center; justify-content: center;
  color: white;
  flex-shrink: 0;
}

.card h3 { font-size: 1.15rem; font-weight: 700; color: var(--navy); margin-bottom: .25rem; }
[data-theme="dark"] .card h3 { color: white; }
.card-subtitle { font-size: .85rem; color: var(--text-light); }
.card-desc { color: var(--text-light); font-size: .9rem; margin-bottom: 1rem; }

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  font-size: .85rem;
}

.badge {
  display: inline-block;
  padding: .25rem .75rem;
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 600;
}

.badge-success { background: #D1FAE5; color: #065F46; }
.badge-warning { background: #FEF3C7; color: #92400E; }
.badge-info { background: #DBEAFE; color: #1E40AF; }

.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: .5rem;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--emerald), var(--emerald-light));
  border-radius: 3px;
  transition: width .5s;
}

/* Lesson View */
.lesson-container { max-width: 900px; }

.lesson-hero {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  color: white;
  padding: 2rem;
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
}

.lesson-hero .breadcrumbs {
  font-size: .85rem;
  color: #94A3B8;
  margin-bottom: .5rem;
}

.lesson-hero h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: .75rem; }

.lesson-meta {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  font-size: .85rem;
  color: #CBD5E1;
}

.lesson-meta span { display: flex; align-items: center; gap: .25rem; }

.lesson-section {
  background: white;
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

[data-theme="dark"] .lesson-section { background: var(--navy-light); }

.section-title {
  display: flex;
  align-items: center;
  gap: .75rem;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 1rem;
  padding-bottom: .75rem;
  border-bottom: 2px solid var(--emerald);
}

[data-theme="dark"] .section-title { color: white; }

.section-icon {
  width: 36px; height: 36px;
  background: var(--emerald);
  color: white;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.lesson-content { line-height: 2; font-size: 1rem; }
.lesson-content h3 { color: var(--emerald-dark); margin: 1.25rem 0 .5rem; font-weight: 700; }
[data-theme="dark"] .lesson-content h3 { color: var(--emerald-light); }
.lesson-content p { margin-bottom: .75rem; }
.lesson-content ul { padding-right: 1.5rem; margin-bottom: 1rem; }
.lesson-content li { margin-bottom: .5rem; }

.definition-box {
  background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
  border-right: 4px solid var(--emerald);
  padding: 1rem;
  border-radius: 8px;
  margin: 1rem 0;
}

[data-theme="dark"] .definition-box { background: rgba(16,185,129,.1); }

.definition-box strong { color: var(--emerald-dark); }

.formula-box {
  background: var(--navy);
  color: white;
  padding: 1.25rem;
  border-radius: 10px;
  text-align: center;
  font-size: 1.15rem;
  font-weight: 700;
  margin: 1rem 0;
  font-family: 'Cairo', monospace;
  direction: ltr;
}

.example-box {
  background: #FFF7ED;
  border-right: 4px solid #F97316;
  padding: 1rem;
  border-radius: 8px;
  margin: 1rem 0;
}

[data-theme="dark"] .example-box { background: rgba(249,115,22,.1); }

.mistake-box {
  background: #FEF2F2;
  border-right: 4px solid #EF4444;
  padding: 1rem;
  border-radius: 8px;
  margin: 1rem 0;
}

[data-theme="dark"] .mistake-box { background: rgba(239,68,68,.1); }

.summary-box {
  background: #EFF6FF;
  border-right: 4px solid #3B82F6;
  padding: 1rem;
  border-radius: 8px;
  margin: 1rem 0;
}

[data-theme="dark"] .summary-box { background: rgba(59,130,246,.1); }

/* Accounting Table */
.acc-table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  background: white;
  border-radius: 8px;
  overflow: hidden;
  font-size: .9rem;
}

[data-theme="dark"] .acc-table { background: var(--navy-dark); }

.acc-table th {
  background: var(--navy);
  color: white;
  padding: .75rem;
  text-align: center;
  font-weight: 700;
}

.acc-table td {
  padding: .6rem;
  border-bottom: 1px solid var(--border);
  text-align: center;
}

.acc-table tr:last-child td { border-bottom: none; }
.acc-table .total { background: var(--emerald); color: white; font-weight: 700; }
.acc-table input {
  width: 100%;
  padding: .4rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  text-align: center;
  background: white;
}

[data-theme="dark"] .acc-table input { background: var(--navy); color: white; }

/* Video Section */
.video-container {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  background: var(--navy);
  border-radius: 10px;
  overflow: hidden;
}

.video-container iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: 0;
}

.video-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  padding: 2rem;
  text-align: center;
}

/* Exercises */
.exercise-card {
  background: white;
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

[data-theme="dark"] .exercise-card { background: var(--navy-light); }

.exercise-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: .5rem;
}

.btn {
  padding: .6rem 1.25rem;
  border-radius: 8px;
  font-weight: 600;
  font-size: .9rem;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
}

.btn-primary { background: var(--emerald); color: white; }
.btn-primary:hover { background: var(--emerald-dark); }
.btn-secondary { background: var(--navy); color: white; }
.btn-secondary:hover { background: var(--navy-light); }
.btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--emerald); color: var(--emerald); }
.btn-danger { background: #EF4444; color: white; }

.btn-sm { padding: .4rem .8rem; font-size: .8rem; }

.mcq-option {
  display: block;
  padding: .75rem 1rem;
  margin: .5rem 0;
  background: var(--sand);
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
}

.mcq-option:hover { border-color: var(--emerald); }
.mcq-option.selected { border-color: var(--emerald); background: #ECFDF5; }
.mcq-option.correct { border-color: #10B981; background: #D1FAE5; }
.mcq-option.incorrect { border-color: #EF4444; background: #FEE2E2; }

[data-theme="dark"] .mcq-option.selected { background: rgba(16,185,129,.2); }
[data-theme="dark"] .mcq-option.correct { background: rgba(16,185,129,.25); }
[data-theme="dark"] .mcq-option.incorrect { background: rgba(239,68,68,.2); }

.solution-box {
  margin-top: 1rem;
  padding: 1rem;
  background: #ECFDF5;
  border-right: 4px solid var(--emerald);
  border-radius: 8px;
  display: none;
}

.solution-box.show { display: block; }

[data-theme="dark"] .solution-box { background: rgba(16,185,129,.1); }

/* Dashboard */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: white;
  padding: 1.5rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 1rem;
}

[data-theme="dark"] .stat-card { background: var(--navy-light); }

.stat-icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  flex-shrink: 0;
}

.stat-icon.navy { background: var(--navy); }
.stat-icon.emerald { background: var(--emerald); }
.stat-icon.orange { background: #F97316; }
.stat-icon.purple { background: #8B5CF6; }

.stat-info h4 { font-size: .85rem; color: var(--text-light); margin-bottom: .25rem; }
.stat-info .value { font-size: 1.75rem; font-weight: 800; color: var(--navy); }
[data-theme="dark"] .stat-info .value { color: white; }

/* Planner */
.planner-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1rem;
}

.day-card {
  background: white;
  border-radius: var(--radius);
  padding: 1rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

[data-theme="dark"] .day-card { background: var(--navy-light); }

.day-card h4 {
  color: var(--emerald-dark);
  margin-bottom: .75rem;
  padding-bottom: .5rem;
  border-bottom: 2px solid var(--emerald);
  font-weight: 700;
}

.task-item {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .5rem;
  border-radius: 6px;
  margin-bottom: .25rem;
  font-size: .85rem;
}

.task-item:hover { background: var(--sand); }

.task-item input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--emerald);
  cursor: pointer;
}

.task-item.completed { text-decoration: line-through; color: var(--text-light); }

/* Quiz */
.quiz-option {
  padding: 1rem;
  margin: .5rem 0;
  background: var(--sand);
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s;
}

.quiz-option:hover { border-color: var(--emerald); }
.quiz-option.selected { border-color: var(--emerald); background: #ECFDF5; }

.timer-display {
  font-size: 2rem;
  font-weight: 800;
  color: var(--emerald);
  text-align: center;
  margin: 1rem 0;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}

.modal-overlay.show { display: flex; }

.modal {
  background: white;
  border-radius: var(--radius);
  max-width: 500px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 1.5rem;
}

[data-theme="dark"] .modal { background: var(--navy-light); color: white; }

.modal h3 { margin-bottom: 1rem; color: var(--navy); }
[data-theme="dark"] .modal h3 { color: white; }

/* Responsive */
@media (max-width: 968px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    right: 0; top: 0;
    width: 280px;
    z-index: 999;
    transform: translateX(100%);
    transition: transform .3s;
  }
  .sidebar.open { transform: translateX(0); }
  .main { padding: 1rem; padding-bottom: 5rem; }
  .mobile-topbar {
    position: sticky;
    top: 0;
    background: var(--sand);
    padding: .75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    margin: -1rem -1rem 1rem;
  }
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: white;
    border-top: 1px solid var(--border);
    display: flex;
    padding: .5rem;
    z-index: 100;
    box-shadow: 0 -4px 6px rgba(0,0,0,.05);
  }
  [data-theme="dark"] .bottom-nav { background: var(--navy-light); }
  .bottom-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: .5rem;
    color: var(--text-light);
    font-size: .7rem;
    background: none;
    border: none;
    gap: .25rem;
  }
  .bottom-nav-item.active { color: var(--emerald); }
}

@media (min-width: 969px) {
  .mobile-topbar, .bottom-nav { display: none; }
}

.hidden { display: none !important; }

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeIn .3s ease-out; }

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: .75rem 1.5rem;
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  z-index: 2000;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}

.toast.show { opacity: 1; }

.bookmark-btn {
  background: none;
  color: var(--text-light);
  padding: .5rem;
  border-radius: 8px;
  transition: all .2s;
}

.bookmark-btn:hover { color: var(--emerald); }
.bookmark-btn.active { color: #F59E0B; }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar (Desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">ن</div>
      <div class="logo-text">
        <h1>نخبة 2AS</h1>
        <p>تسيير واقتصاد</p>

// ===================== STATE MANAGEMENT =====================

const state = {
  currentRoute: 'home',
  currentLesson: null,
  completedLessons: JSON.parse(localStorage.getItem('nokhba_completed') || '[]'),
  bookmarks: JSON.parse(localStorage.getItem('nokhba_bookmarks') || '[]'),
  quizResults: JSON.parse(localStorage.getItem('nokhba_quizzes') || '[]'),
  tasks: JSON.parse(localStorage.getItem('nokhba_tasks') || '[]'),
  streak: parseInt(localStorage.getItem('nokhba_streak') || '0'),
  theme: localStorage.getItem('nokhba_theme') || 'light'
};

// Apply theme
document.documentElement.setAttribute('data-theme', state.theme);

// ===================== ROUTING =====================

function navigate(route, data = null) {
  state.currentRoute = route;
  state.currentLesson = data;
  render();
  updateNavActive();
  window.scrollTo(0, 0);
  
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
}

function updateNavActive() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === state.currentRoute);
  });
  document.querySelectorAll('.bottom-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === state.currentRoute);
  });
}

// ===================== RENDERERS =====================

function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  content.classList.remove('fade-in');
  
  let html = '';
  switch (state.currentRoute) {
    case 'home': html = renderHome(); break;
    case 'subjects': html = renderSubjects(); break;
    case 'subject': html = renderSubject(state.currentLesson); break;
    case 'lesson': html = renderLesson(state.currentLesson); break;
    case 'dashboard': html = renderDashboard(); break;
    case 'planner': html = renderPlanner(); break;
    case 'quizzes': html = renderQuizzes(); break;
    case 'quiz': html = renderQuiz(state.currentLesson); break;
    case 'bookmarks': html = renderBookmarks(); break;
    case 'videos': html = renderVideos(); break;
    default: html = renderHome();
  }
  
  content.innerHTML = html;
  setTimeout(() => content.classList.add('fade-in'), 10);
  attachHandlers();
}

  const lessons = Object.values(LESSONS).filter(l => l.subjectId === subjectId);
  
  return `
    <div class="page-title">
      <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: .5rem;">
        <button class="btn btn-outline btn-sm" onclick="navigate('subjects')">→ العودة</button>

      <h2>${subject.icon} ${subject.name}</h2>

        <p style="color: var(--text-light);">سيتم إضافة دروس هذه المادة قريباً. يرجى الرجوع لاحقاً أو اختيار مادة أخرى.</p>

        <div class="lesson-section">

                      if (r.total) {

        <div class="lesson-section">

            <div class="exercise-header">
              <div>
                <strong>التمرين ${i + 1}</strong>

                </span>
              </div>
              <span class="badge badge-info">${ex.type === 'mcq' ? 'اختيار متعدد' : ex.type === 'journal' ? 'قيد محاسبي' : ex.type === 'calculation' ? 'حساب' : 'سؤال مفتوح'}</span>

              <div id="mcq-${ex.id}">

function renderDashboard() {
  const totalLessons = Object.keys(LESSONS).length;
  const completed = state.completedLessons.length;
  const progress = totalLessons > 0 ? Math.round((completed / totalLessons) * 100) : 0;
  
  // Group by subject
  const subjectProgress = SUBJECTS.map(s => {
    const subjectLessons = Object.values(LESSONS).filter(l => l.subjectId === s.id);
    const subjectCompleted = subjectLessons.filter(l => state.completedLessons.includes(l.id)).length;
    return {
      ...s,
      total: subjectLessons.length,
      completed: subjectCompleted,
      percent: subjectLessons.length > 0 ? Math.round((subjectCompleted / subjectLessons.length) * 100) : 0
    };
  });
  
  const recentQuizzes = state.quizResults.slice(-5).reverse();
  const avgScore = recentQuizzes.length > 0 
    ? Math.round(recentQuizzes.reduce((a, q) => a + q.score, 0) / recentQuizzes.length)
    : 0;
  
  return `
    <div class="page-title">
      <h2>لوحة التحكم الخاصة بك 📊</h2>
      <p>تتبع تقدمك الدراسي وأداءك</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon navy">📚</div>
        <div class="stat-info">
          <h4>الدروس المكتملة</h4>
          <div class="value">${completed}/${totalLessons}</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon emerald">📈</div>
        <div class="stat-info">
          <h4>التقدم الإجمالي</h4>
          <div class="value">${progress}%</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">🔥</div>
        <div class="stat-info">
          <h4>سلسلة الدراسة</h4>
          <div class="value">${state.streak} يوم</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">🎯</div>
        <div class="stat-info">
          <h4>معدل الاختبارات</h4>
          <div class="value">${avgScore}/20</div>
        </div>
      </div>
    </div>

    <div class="lesson-section">
      <div class="section-title">
        <div class="section-icon">📊</div>
        تقدمك في كل مادة
      </div>
      ${subjectProgress.map(s => `
        <div style="margin-bottom: 1rem; padding: 1rem; background: var(--sand); border-radius: 10px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: .5rem; flex-wrap: wrap; gap: .5rem;">
            <strong>${s.icon} ${s.name}</strong>
            <span>${s.completed}/${s.total} دروس (${s.percent}%)</span>
          </div>
          <div class="progress-bar" style="height: 8px;">
            <div class="progress-fill" style="width: ${s.percent}%;"></div>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="lesson-section">
      <div class="section-title">
        <div class="section-icon">📝</div>
        آخر الاختبارات
      </div>
      ${recentQuizzes.length === 0 ? `
        <p style="text-align: center; padding: 2rem; color: var(--text-light);">
          لم تنجز أي اختبار بعد. <button class="btn btn-primary btn-sm" onclick="navigate('quizzes')">ابدأ الآن</button>
        </p>
      ` : recentQuizzes.map(q => `
        <div style="padding: 1rem; border-bottom: 1px solid var(--border);">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong>${q.subject}</strong>
              <div style="font-size: .85rem; color: var(--text-light);">${new Date(q.date).toLocaleDateString('ar-DZ')}</div>
            </div>
            <div style="text-align: left;">
              <div style="font-size: 1.5rem; font-weight: 800; color: ${q.score >= 10 ? 'var(--emerald)' : '#EF4444'};">${q.score}/20</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="lesson-section">
      <div class="section-title">
        <div class="section-icon" style="background: #EF4444;">🔥</div>
        مواضيع تحتاج إلى مراجعة
      </div>
      ${subjectProgress.filter(s => s.percent < 50 && s.total > 0).length === 0 ? `
        <p style="text-align: center; padding: 1rem; color: var(--text-light);">
          🎉 أحسنت! لا توجد مواد تحتاج إلى اهتمام خاص حالياً.
        </p>
      ` : subjectProgress.filter(s => s.percent < 50 && s.total > 0).map(s => `
        <div style="padding: 1rem; background: #FEF2F2; border-radius: 10px; margin-bottom: .5rem;">
          <strong>${s.icon} ${s.name}</strong>
          <p style="font-size: .9rem; margin-top: .25rem;">تقدمك ${s.percent}% فقط. ننصحك بمراجعة دروس هذه المادة.</p>
          <button class="btn btn-outline btn-sm" style="margin-top: .5rem;" onclick="navigate('subject', '${s.id}')">مراجعة الدروس</button>
        </div>
      `).join('')}
    </div>

    <div class="lesson-section">
      <div class="section-title">
        <div class="section-icon" style="background: #F59E0B;">⚙️</div>
        إعدادات الحساب
      </div>
      <p style="margin-bottom: 1rem; color: var(--text-light);">إدارة بياناتك المحلية</p>
      <button class="btn btn-danger" onclick="resetProgress()">🗑 مسح جميع التقدم والبدء من جديد</button>
    </div>
  `;
}

function renderQuiz(subjectId) {
  const subject = SUBJECTS.find(s => s.id === subjectId);
  const lessons = Object.values(LESSONS).filter(l => l.subjectId === subjectId);
  const exercises = [];
  lessons.forEach(l => {
    l.exercises.forEach(e => {
      if (e.type === 'mcq') {
        exercises.push({ ...e, lessonTitle: l.title });
      }
    });
  });
  
  if (exercises.length === 0) {
    return `
      <div class="page-title">
        <h2>لا توجد أسئلة MCQ متاحة</h2>
      </div>
      <div class="lesson-section" style="text-align: center; padding: 3rem;">
        <p>لم نعثر على أسئلة اختيار من متعدد لهذه المادة بعد.</p>
        <button class="btn btn-primary" style="margin-top: 1rem;" onclick="navigate('quizzes')">العودة</button>
      </div>
    `;
  }
  
  // Take up to 10 random questions
  const shuffled = [...exercises].sort(() => 0.5 - Math.random()).slice(0, 10);
  const quizState = {
    questions: shuffled,
    current: 0,
    answers: [],
    startTime: Date.now(),
    timeLeft: 15 * 60, // 15 minutes
    subject: subject.name
  };
  
  window.currentQuiz = quizState;
  return renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = window.currentQuiz;
  if (!q) return '';
  
  const current = q.questions[q.current];
  const progress = ((q.current + 1) / q.questions.length) * 100;
  
  return `
    <div class="page-title">
      <h2>🎯 اختبار: ${q.subject}</h2>
      <p>السؤال ${q.current + 1} من ${q.questions.length}</p>
    </div>

    <div class="lesson-section">
      <div class="timer-display" id="quizTimer">⏱ ${Math.floor(q.timeLeft / 60)}:${String(q.timeLeft % 60).padStart(2, '0')}</div>
      
      <div class="progress-bar" style="margin-bottom: 1.5rem;">
        <div class="progress-fill" style="width: ${progress}%;"></div>
      </div>

      <div style="background: var(--sand); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
        <div style="font-size: .85rem; color: var(--text-light); margin-bottom: .25rem;">من درس: ${current.lessonTitle}</div>
        <h3 style="margin: 0;">${current.question}</h3>
      </div>

      <div id="quizOptions">
        ${current.options.map((opt, i) => `
          <div class="quiz-option" onclick="selectQuizOption(${i})" id="qopt-${i}">
            <strong>${String.fromCharCode(65 + i)}.</strong> ${opt}
          </div>
        `).join('')}
      </div>

      <div style="display: flex; gap: .5rem; margin-top: 1.5rem; flex-wrap: wrap;">
        <button class="btn btn-outline" onclick="navigate('quizzes')">✗ إلغاء</button>
        <button class="btn btn-primary" id="quizNextBtn" onclick="nextQuizQuestion()" disabled style="margin-right: auto;">
          ${q.current === q.questions.length - 1 ? '✓ إنهاء الاختبار' : '→ السؤال التالي'}
        </button>
      </div>
    </div>
  `;
}

function selectQuizOption(i) {
  document.querySelectorAll('.quiz-option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  window.currentQuiz.selectedAnswer = i;
  document.getElementById('quizNextBtn').disabled = false;
}

function nextQuizQuestion() {
  const q = window.currentQuiz;
  q.answers.push(q.selectedAnswer);
  
  if (q.current < q.questions.length - 1) {
    q.current++;
    q.selectedAnswer = null;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const q = window.currentQuiz;
  let correct = 0;
  q.questions.forEach((question, i) => {
    if (q.answers[i] === question.correct) correct++;
  });
  
  const score = Math.round((correct / q.questions.length) * 20);
  
  state.quizResults.push({
    subject: q.subject,
    score: score,
    correct: correct,
    total: q.questions.length,
    date: new Date().toISOString()
  });
  localStorage.setItem('nokhba_quizzes', JSON.stringify(state.quizResults));
  
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="page-title">
      <h2>🎉 انتهى الاختبار!</h2>
    </div>

    <div class="lesson-section" style="text-align: center;">
      <div style="font-size: 4rem; margin-bottom: 1rem;">
        ${score >= 15 ? '🏆' : score >= 10 ? '👍' : '💪'}
      </div>
      <div style="font-size: 3rem; font-weight: 800; color: ${score >= 10 ? 'var(--emerald)' : '#EF4444'}; margin-bottom: .5rem;">
        ${score}/20
      </div>
      <p style="font-size: 1.1rem; margin-bottom: 1rem;">
        أجبت بشكل صحيح على ${correct} من ${q.questions.length} أسئلة
      </p>
      <div style="display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap;">
        <button class="btn btn-primary" onclick="startQuiz('${SUBJECTS.find(s => s.name === q.subject).id}')">🔄 إعادة الاختبار</button>
        <button class="btn btn-outline" onclick="navigate('quizzes')">اختبار آخر</button>
        <button class="btn btn-outline" onclick="navigate('dashboard')">لوحة التحكم</button>
      </div>
    </div>

    <div class="lesson-section">
      <div class="section-title">
        <div class="section-icon">📊</div>
        مراجعة الإجابات
      </div>
      ${q.questions.map((question, i) => {
        const userAns = q.answers[i];
        const isCorrect = userAns === question.correct;
        return `
          <div style="padding: 1rem; background: ${isCorrect ? '#ECFDF5' : '#FEF2F2'}; border-radius: 8px; margin-bottom: .5rem;">
            <div style="display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem;">
              <span style="font-size: 1.5rem;">${isCorrect ? '✓' : '✗'}</span>
              <strong>السؤال ${i + 1}:</strong> ${question.question}
            </div>
            <div style="font-size: .9rem;">
              <div style="color: ${isCorrect ? 'var(--emerald-dark)' : '#EF4444'};">
                إجابتك: <strong>${userAns !== undefined ? question.options[userAns] : 'لم تُجب'}</strong>
              </div>
              ${!isCorrect ? `
                <div style="color: var(--emerald-dark); margin-top: .25rem;">
                  الإجابة الصحيحة: <strong>${question.options[question.correct]}</strong>
                </div>
              ` : ''}
              ${question.explanation ? `<div style="margin-top: .5rem; color: var(--text-light); font-size: .85rem;">${question.explanation}</div>` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function toggleComplete(lessonId) {
  if (state.completedLessons.includes(lessonId)) {
    state.completedLessons = state.completedLessons.filter(id => id !== lessonId);
    showToast('تم إزالة العلامة');
  } else {
    state.completedLessons.push(lessonId);
    showToast('✓ تم وضع علامة كمكتمل');
  }
  localStorage.setItem('nokhba_completed', JSON.stringify(state.completedLessons));
  render();
}

function toggleBookmark(lessonId) {
  if (state.bookmarks.includes(lessonId)) {
    state.bookmarks = state.bookmarks.filter(id => id !== lessonId);
    showToast('تم إزالة المحفوظ');
  } else {
    state.bookmarks.push(lessonId);
    showToast('⭐ تم الإضافة للمحفوظات');
  }
  localStorage.setItem('nokhba_bookmarks', JSON.stringify(state.bookmarks));
  render();
}

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  localStorage.setItem('nokhba_theme', state.theme);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function toggleSolution(exId) {
  const sol = document.getElementById(`sol-${exId}`);
  sol.classList.toggle('show');
}

function checkMCQ(exId, correct) {
  const selected = document.querySelector(`input[name="${exId}"]:checked`);
  if (!selected) {
    showToast('الرجاء اختيار إجابة أولاً');
    return;
  }
  
  const userAnswer = parseInt(selected.value);
  const options = document.querySelectorAll(`#mcq-${exId} .mcq-option`);
  options.forEach((opt, i) => {
    opt.classList.remove('correct', 'incorrect');
    if (i === correct) opt.classList.add('correct');
    if (i === userAnswer && userAnswer !== correct) opt.classList.add('incorrect');
  });
  
  if (userAnswer === correct) {
    showToast('✓ إجابة صحيحة!');
  } else {
    showToast('✗ إجابة خاطئة، راجع الحل المفصل');
  }
}

function reportError(lessonId) {
  const message = prompt('صف الخطأ الذي لاحظته في هذا الدرس:');

    showToast('شكراً لك! تم إرسال البلاغ للمراجعة');
  }

function suggestVideo(lessonId, index) {
  const url = prompt('أدخل رابط YouTube للفيديو المقترح:');
  if (url && url.includes('youtube.com')) {
    showToast('شكراً! سيتم مراجعة اقتراحك من قبل الإدارة');
  }
}

function addTask() {
  const text = prompt('أدخل المهمة الجديدة:');
  const day = prompt('رقم اليوم (0=الأحد، 1=الإثنين، ... 6=السبت):');
  if (text && day !== null && !isNaN(parseInt(day))) {
    state.tasks.push({
      id: Date.now(),
      day: parseInt(day),
      text,
      completed: false
    });
    saveTasks();
    render();
    showToast('✓ تمت إضافة المهمة');
  }
}

function toggleTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (task) {
    task.completed = !task.completed;
    saveTasks();
    render();
  }
}

function deleteTask(id) {
  if (confirm('هل تريد حذف هذه المهمة؟')) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveTasks();
    render();
  }
}

function saveTasks() {
  localStorage.setItem('nokhba_tasks', JSON.stringify(state.tasks));
}

function resetProgress() {
  if (confirm('هل أنت متأكد؟ سيتم حذف جميع تقدمك وعلاماتك!')) {
    localStorage.clear();
    state.completedLessons = [];
    state.bookmarks = [];
    state.quizResults = [];
    state.tasks = [];
    state.streak = 0;
    showToast('تم مسح جميع البيانات');
    render();
  }
}

// Pomodoro Timer
let timerInterval = null;
let timerSeconds = 25 * 60;

function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    timerSeconds--;
    const display = document.getElementById('timerDisplay');
    if (display) {
      display.textContent = `${Math.floor(timerSeconds / 60)}:${String(timerSeconds % 60).padStart(2, '0')}`;
    }
    if (timerSeconds <= 0) {
      pauseTimer();
      showToast('⏰ انتهى الوقت! خذ استراحة 5 دقائق');
      timerSeconds = 25 * 60;
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function resetTimer() {
  pauseTimer();
  timerSeconds = 25 * 60;
  const display = document.getElementById('timerDisplay');
  if (display) display.textContent = '25:00';
}

// Quiz Timer
let quizTimer = null;
function startQuizTimer() {
  if (quizTimer) return;
  const q = window.currentQuiz;
  if (!q) return;
  quizTimer = setInterval(() => {
    q.timeLeft--;
    const display = document.getElementById('quizTimer');
    if (display) {
      display.textContent = `⏱ ${Math.floor(q.timeLeft / 60)}:${String(q.timeLeft % 60).padStart(2, '0')}`;
    }
    if (q.timeLeft <= 0) {
      clearInterval(quizTimer);
      quizTimer = null;
      finishQuiz();
    }
  }, 1000);
}

// Toast
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Attach event handlers
function attachHandlers() {
  // Navigation
  document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
    el.onclick = () => navigate(el.dataset.route);
  });
  
  // Search
  const search = document.getElementById('searchInput');
  if (search) {
    search.onkeyup = (e) => {
      if (e.key === 'Enter') {
        const q = search.value.toLowerCase().trim();
        if (!q) return;
        const result = Object.values(LESSONS).find(l => 
          l.title.toLowerCase().includes(q) || 
          l.subject.toLowerCase().includes(q)
        );
        if (result) navigate('lesson', result.id);
        else showToast('لم يتم العثور على نتائج');
      }
    };
  }
  
  // Start quiz timer if in quiz
  if (state.currentRoute === 'quiz' && window.currentQuiz) {
    startQuizTimer();
  }
}

// Initial render
render();
