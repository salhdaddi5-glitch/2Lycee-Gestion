<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نخبة 2AS | منصة تعليمية ذكية - Division 2G1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0A192F;
  --navy-light: #112240;
  --emerald: #10B981;
  --emerald-dark: #059669;
  --sand: #F8FAFC;
  --text: #1E293B;
  --text-light: #64748B;
  --border: #E2E8F0;
  --shadow: 0 4px 6px -1px rgba(0,0,0,.1);
  --radius: 12px;
}

[data-theme="dark"] {
  --sand: #0F172A;
  --text: #F1F5F9;
  --text-light: #94A3B8;
  --border: #1E293B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans Arabic', 'Cairo', sans-serif;
  background: var(--sand);
  color: var(--text);
  line-height: 1.7;
  direction: rtl;
}

.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }

.sidebar {
  background: var(--navy);
  color: white;
  padding: 1.5rem 1rem;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.logo {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 0 .75rem 1.5rem;
  border-bottom: 1px solid rgba(255,255,255,.1);
  margin-bottom: 1.5rem;
}

.logo-icon {
  width: 44px; height: 44px;
  background: var(--emerald);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.5rem; color: var(--navy);
}

.nav-item {
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1rem;
  margin-bottom: .25rem;
  border-radius: 10px;
  color: #CBD5E1;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  text-align: right;
  transition: all .2s;
}

.nav-item:hover { background: var(--navy-light); color: white; }
.nav-item.active { background: var(--emerald); color: var(--navy); font-weight: 700; }

.main { padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.page-title h2 {
  font-size: 2rem;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: .5rem;
}

[data-theme="dark"] .page-title h2 { color: white; }

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.25rem;
  margin-bottom: 2rem;
}

.card {
  background: white;
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: all .2s;
  cursor: pointer;
}

[data-theme="dark"] .card { background: var(--navy-light); }

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 25px -5px rgba(0,0,0,.1);
  border-color: var(--emerald);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.card-icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
  display: flex; align-items: center; justify-content: center;
  color: white;
  flex-shrink: 0;
}

.card h3 { font-size: 1.15rem; font-weight: 700; color: var(--navy); margin-bottom: .25rem; }
[data-theme="dark"] .card h3 { color: white; }

.btn {
  padding: .6rem 1.25rem;
  border-radius: 8px;
  font-weight: 600;
  font-size: .9rem;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  border: none;
  cursor: pointer;
}

.btn-primary { background: var(--emerald); color: white; }
.btn-primary:hover { background: var(--emerald-dark); }
.btn-secondary { background: var(--navy); color: white; }
.btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }

/* Schedule Table */
.schedule-container {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 2rem;
}

[data-theme="dark"] .schedule-container { background: var(--navy-light); }

.schedule-header {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  color: white;
  padding: 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

.schedule-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .9rem;
}

.schedule-table th {
  background: var(--navy);
  color: white;
  padding: 1rem .5rem;
  text-align: center;
  font-weight: 700;
  border: 1px solid rgba(255,255,255,.1);
}

.schedule-table td {
  padding: .75rem .5rem;
  border: 1px solid var(--border);
  text-align: center;
  vertical-align: middle;
  min-width: 100px;
}

.schedule-table tr:nth-child(even) { background: var(--sand); }
[data-theme="dark"] .schedule-table tr:nth-child(even) { background: var(--navy); }

.schedule-cell {
  cursor: pointer;
  transition: all .2s;
  padding: .5rem;
  border-radius: 6px;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .25rem;
}

.schedule-cell:hover { background: rgba(16,185,129,.1); }

.schedule-cell.filled {
  background: linear-gradient(135deg, rgba(16,185,129,.15), rgba(16,185,129,.05));
  border: 2px solid var(--emerald);
}

.schedule-cell.current {
  background: linear-gradient(135deg, #F59E0B, #D97706);
  color: white;
  animation: pulse 2s infinite;
}

.schedule-cell.next {
  background: linear-gradient(135deg, #3B82F6, #1E40AF);
  color: white;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .8; }
}

.schedule-cell .subject-name {
  font-weight: 700;
  font-size: .85rem;
  color: var(--navy);
}

.schedule-cell.current .subject-name,
.schedule-cell.next .subject-name { color: white; }

[data-theme="dark"] .schedule-cell .subject-name { color: white; }

.schedule-cell .subject-teacher {
  font-size: .75rem;
  color: var(--text-light);
}

.schedule-cell.current .subject-teacher,
.schedule-cell.next .subject-teacher { color: rgba(255,255,255,.9); }

/* AI Chat */
.ai-container {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 70vh;
  max-height: 700px;
}

[data-theme="dark"] .ai-container { background: var(--navy-light); }

.ai-header {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  color: white;
  padding: 1.5rem;
  border-radius: var(--radius) var(--radius) 0 0;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.ai-avatar {
  width: 50px; height: 50px;
  background: var(--emerald);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
}

.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.message {
  display: flex;
  gap: .75rem;
  max-width: 85%;
}

.message.user {
  flex-direction: row-reverse;
  align-self: flex-end;
}

.message-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1.25rem;
}

.message.ai .message-avatar { background: var(--emerald); color: white; }
.message.user .message-avatar { background: var(--navy); color: white; }

.message-content {
  background: var(--sand);
  padding: 1rem;
  border-radius: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

[data-theme="dark"] .message-content { background: var(--navy); }

.message.user .message-content { background: var(--emerald); color: white; }

.ai-input-area {
  padding: 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}

.ai-input-area textarea {
  flex: 1;
  min-height: 60px;
  padding: .75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  resize: vertical;
  font-family: inherit;
  font-size: .95rem;
}

.image-preview {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  margin-bottom: .5rem;
  width: 100%;
}

.image-preview-item {
  position: relative;
  width: 80px; height: 80px;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid var(--border);
}

.image-preview-item img {
  width: 100%; height: 100%;
  object-fit: cover;
}

.image-preview-item .remove-btn {
  position: absolute;
  top: 2px; left: 2px;
  background: rgba(239,68,68,.9);
  color: white;
  border: none;
  border-radius: 50%;
  width: 20px; height: 20px;
  cursor: pointer;
  font-size: .75rem;
  display: flex; align-items: center; justify-content: center;
}

.lesson-section {
  background: white;
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

[data-theme="dark"] .lesson-section { background: var(--navy-light); }

.section-title {
  display: flex;
  align-items: center;
  gap: .75rem;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 1rem;
  padding-bottom: .75rem;
  border-bottom: 2px solid var(--emerald);
}

[data-theme="dark"] .section-title { color: white; }

.section-icon {
  width: 36px; height: 36px;
  background: var(--emerald);
  color: white;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.badge {
  display: inline-block;
  padding: .25rem .75rem;
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 600;
}

.badge-success { background: #D1FAE5; color: #065F46; }
.badge-warning { background: #FEF3C7; color: #92400E; }
.badge-info { background: #DBEAFE; color: #1E40AF; }

.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: .75rem 1.5rem;
  border-radius: 10px;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,.2);
  z-index: 2000;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}

.toast.show { opacity: 1; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}

.modal-overlay.show { display: flex; }

.modal {
  background: white;
  border-radius: var(--radius);
  max-width: 500px;
  width: 100%;
  padding: 1.5rem;
  max-height: 90vh;
  overflow-y: auto;
}

[data-theme="dark"] .modal { background: var(--navy-light); color: white; }

.form-group { margin-bottom: 1rem; }
.form-group label { display: block; margin-bottom: .5rem; font-weight: 600; }
.form-group input, .form-group select {
  width: 100%;
  padding: .75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 968px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    right: 0; top: 0;
    width: 280px;
    z-index: 999;
    transform: translateX(100%);
    transition: transform .3s;
  }
  .sidebar.open { transform: translateX(0); }
  .main { padding: 1rem; }
  .schedule-table { font-size: .75rem; }
  .schedule-table td, .schedule-table th { padding: .5rem .25rem; min-width: 70px; }
  .message { max-width: 95%; }
}

.quick-actions {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  margin-top: .5rem;
}

.quick-action-btn {
  padding: .4rem .8rem;
  background: var(--sand);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: .8rem;
  cursor: pointer;
  transition: all .2s;
}

.quick-action-btn:hover {
  background: var(--emerald);
  color: white;
  border-color: var(--emerald);
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">ن</div>
      <div>
        <h1 style="font-size: 1.1rem; font-weight: 800;">نخبة 2AS</h1>
        <p style="font-size: .75rem; color: #94A3B8;">Division 2G1</p>
      </div>
    </div>

    <button class="nav-item active" data-route="home"> الرئيسية</button>
    <button class="nav-item" data-route="schedule">📅 جدولي الدراسي</button>
    <button class="nav-item" data-route="ai">🤖 المساعد الدراسي</button>
    <button class="nav-item" data-route="subjects">📚 موادّي الدراسية</button>
    <button class="nav-item" data-route="lessons"> دروسي</button>
    <button class="nav-item" data-route="exercises">️ تماريني</button>
    <button class="nav-item" data-route="progress"> تقدمّي الدراسي</button>
    <button class="nav-item" data-route="dashboard">️ الإعدادات</button>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <button class="btn btn-outline" onclick="toggleSidebar()" style="display: none;" id="menuBtn">☰</button>
      <div style="flex: 1;"></div>
      <button class="btn btn-outline" onclick="toggleTheme()">🌙</button>
    </div>

    <div id="content"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ==================== STATE ====================
const state = {
  currentRoute: 'home',
  theme: localStorage.getItem('theme') || 'light',
  schoolSchedule: JSON.parse(localStorage.getItem('schoolSchedule2G1') || 'null'),
  homeSchedule: JSON.parse(localStorage.getItem('homeSchedule') || '{}'),
  aiMessages: JSON.parse(localStorage.getItem('aiMessages') || '[]'),
  uploadedImages: [],
  geminiApiKey: localStorage.getItem('geminiApiKey') || '',
  completedLessons: JSON.parse(localStorage.getItem('completedLessons') || '[]'),
  bookmarks: JSON.parse(localStorage.getItem('bookmarks') || '[]')
};

document.documentElement.setAttribute('data-theme', state.theme);

// Initialize default schedule if not exists
if (!state.schoolSchedule) {
  state.schoolSchedule = {
    '0-0': { subject: 'ECOM', teacher: 'M.GES1', subjectAr: 'الاقتصاد والمناجمنت' },
    '0-1': { subject: 'ANG', teacher: 'M.ANG7', subjectAr: 'اللغة الإنجليزية' },
    '0-2': { subject: 'MATH', teacher: 'M.MATH10', subjectAr: 'الرياضيات' },
    '0-3': { subject: 'SPOR', teacher: 'M.SPO84', subjectAr: 'التربية البدنية' },
    '0-4': { subject: 'HU/GE', teacher: 'M.HIS6', subjectAr: 'التاريخ والجغرافيا' },
    '0-5': { subject: 'Ge/com', teacher: 'M.GES4', subjectAr: 'التسيير المحاسبي' },
    '0-7': { subject: 'MATH', teacher: 'M.MATH10', subjectAr: 'الرياضيات' },
    '1-0': { subject: 'FRAN', teacher: 'M.FRAN7', subjectAr: 'اللغة الفرنسية' },
    '1-1': { subject: 'MATH', teacher: 'M.MATH10', subjectAr: 'الرياضيات' },
    '1-2': { subject: 'ECONOM', teacher: 'M.GES1', subjectAr: 'الاقتصاد' },
    '1-4': { subject: 'Ge/com', teacher: 'M.GES4', subjectAr: 'التسيير المحاسبي' },
    '2-0': { subject: 'HU/GE', teacher: 'M.HIS6', subjectAr: 'التاريخ والجغرافيا' },
    '2-1': { subject: 'ARAB', teacher: 'M.ARAB10', subjectAr: 'اللغة العربية' },
    '2-2': { subject: 'SC/IS', teacher: 'M.SC/IS4', subjectAr: 'العلوم الإسلامية' },
    '2-3': { subject: 'Droit', teacher: 'M.GES4', subjectAr: 'القانون' },
    '3-0': { subject: 'Ge/com', teacher: 'M.GES4', subjectAr: 'التسيير المحاسبي' },
    '3-1': { subject: 'ARAB', teacher: 'M.ARAB10', subjectAr: 'اللغة العربية' },
    '3-2': { subject: 'ANG', teacher: 'M.ANG7', subjectAr: 'اللغة الإنجليزية' },
    '3-3': { subject: 'Droit', teacher: 'M.GES4', subjectAr: 'القانون' },
    '3-4': { subject: 'MATH', teacher: 'M.MATH10', subjectAr: 'الرياضيات' },
    '3-5': { subject: 'FRAN', teacher: 'M.FRAN7', subjectAr: 'اللغة الفرنسية' },
    '4-0': { subject: 'HU/GE', teacher: 'M.HIS6', subjectAr: 'التاريخ والجغرافيا' },
    '4-1': { subject: 'FRAN', teacher: 'M.FRAN7', subjectAr: 'اللغة الفرنسية' },
    '4-2': { subject: 'ARAB', teacher: 'M.ARAB10', subjectAr: 'اللغة العربية' },
    '4-3': { subject: 'ANG', teacher: 'M.ANG7', subjectAr: 'اللغة الإنجليزية' },
    '4-4': { subject: 'SC/IS', teacher: 'M.SC/IS4', subjectAr: 'العلوم الإسلامية' }
  };
  localStorage.setItem('schoolSchedule2G1', JSON.stringify(state.schoolSchedule));
}

// ==================== GEMINI AI ====================
const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';

async function callGeminiAPI(prompt, images = []) {
  if (!state.geminiApiKey) {
    return { error: 'لم يتم إعداد مفتاح API. يرجى إدخال مفتاح Google Gemini API من الإعدادات.' };
  }

  const parts = [{ text: prompt }];

  for (const img of images) {
    parts.push({
      inline_data: {
        mime_type: img.type,
        data: img.data
      }
    });
  }

  try {
    const response = await fetch(`${GEMINI_API_URL}?key=${state.geminiApiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts }],
        generationConfig: {
          temperature: 0.7,
          topK: 40,
          topP: 0.95,
          maxOutputTokens: 2048,
        }
      })
    });

    if (!response.ok) {
      const error = await response.json();
      return { error: `خطأ في API: ${error.error?.message || 'غير معروف'}` };
    }

    const data = await response.json();
    return { text: data.candidates[0].content.parts[0].text };
  } catch (err) {
    return { error: `خطأ في الاتصال: ${err.message}` };
  }
}

// ==================== ROUTING ====================
function navigate(route) {
  state.currentRoute = route;
  render();
  updateNav();
  window.scrollTo(0, 0);
  document.getElementById('sidebar').classList.remove('open');
}

function updateNav() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === state.currentRoute);
  });
}

// ==================== RENDERERS ====================
function render() {
  const content = document.getElementById('content');
  let html = '';

  switch (state.currentRoute) {
    case 'home': html = renderHome(); break;
    case 'schedule': html = renderSchedule(); break;
    case 'ai': html = renderAI(); break;
    case 'subjects': html = renderSubjects(); break;
    case 'lessons': html = renderLessons(); break;
    case 'exercises': html = renderExercises(); break;
    case 'progress': html = renderProgress(); break;
    case 'dashboard': html = renderDashboard(); break;
    default: html = renderHome();
  }

  content.innerHTML = html;
  attachHandlers();
}

function renderHome() {
  const currentClass = getCurrentClass();
  const nextClass = getNextClass();
  
  return `
    <div class="page-title">
      <h2>مرحباً بك في نخبة 2AS 🎓</h2>
      <p>Division 2G1 - Lycée Thaalbiya El Alger | السنة الثانية ثانوي - تسيير واقتصاد</p>
    </div>

    ${currentClass ? `
      <div class="lesson-section" style="background: linear-gradient(135deg, #F59E0B, #D97706); color: white; border: none;">
        <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
          <div style="font-size: 3rem;">📚</div>
          <div style="flex: 1;">
            <h3 style="margin: 0; color: white;">الحصة الحالية</h3>
            <p style="margin: .5rem 0 0; font-size: 1.1rem;"><strong>${currentClass.subjectAr}</strong> - ${currentClass.subject} (${currentClass.teacher})</p>
            <p style="margin: .25rem 0 0; font-size: .9rem; opacity: .9;">${currentClass.time}</p>
          </div>
        </div>
      </div>

// ==================== HELPER FUNCTIONS ====================

function getCurrentClass() {
  const now = new Date();
  const day = now.getDay(); // 0=Sunday, 6=Saturday
  const hour = now.getHours();
  const minute = now.getMinutes();
  const currentTime = hour * 60 + minute;

  const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
  const times = [
    { start: 8*60, end: 9*60, idx: 0 },
    { start: 9*60, end: 10*60, idx: 1 },
    { start: 10*60, end: 11*60, idx: 2 },
    { start: 11*60, end: 12*60, idx: 3 },
    { start: 12*60, end: 13*60, idx: 4 },
    { start: 13*60, end: 14*60, idx: 5 },
    { start: 14*60, end: 14*60+30, idx: 6 },
    { start: 15*60+30, end: 16*60+30, idx: 7 }
  ];

  if (day > 4) return null; // Friday or Saturday

  for (const time of times) {
    if (currentTime >= time.start && currentTime < time.end) {
      const key = `${day}-${time.idx}`;
      const cell = state.schoolSchedule[key];
      if (cell) {
        return {
          ...cell,
          key,
          time: `${String(Math.floor(time.start/60)).padStart(2,'0')}:${String(time.start%60).padStart(2,'0')} - ${String(Math.floor(time.end/60)).padStart(2,'0')}:${String(time.end%60).padStart(2,'0')}`
        };
      }
    }
  }

  return null;
}

function getNextClass() {
  const now = new Date();
  const day = now.getDay();
  const hour = now.getHours();
  const minute = now.getMinutes();
  const currentTime = hour * 60 + minute;

  const times = [
    { start: 8*60, end: 9*60, idx: 0 },
    { start: 9*60, end: 10*60, idx: 1 },
    { start: 10*60, end: 11*60, idx: 2 },
    { start: 11*60, end: 12*60, idx: 3 },
    { start: 12*60, end: 13*60, idx: 4 },
    { start: 13*60, end: 14*60, idx: 5 },
    { start: 14*60, end: 14*60+30, idx: 6 },
    { start: 15*60+30, end: 16*60+30, idx: 7 }
  ];

  // Check remaining times today
  for (const time of times) {
    if (currentTime < time.start) {
      const key = `${day}-${time.idx}`;
      const cell = state.schoolSchedule[key];
      if (cell) {
        return {
          ...cell,
          key,
          time: `${String(Math.floor(time.start/60)).padStart(2,'0')}:${String(time.start%60).padStart(2,'0')} - ${String(Math.floor(time.end/60)).padStart(2,'0')}:${String(time.end%60).padStart(2,'0')}`
        };
      }
    }
  }

  // Check next days
  for (let d = day + 1; d <= 4; d++) {
    for (const time of times) {
      const key = `${d}-${time.idx}`;
      const cell = state.schoolSchedule[key];
      if (cell) {
        return {
          ...cell,
          key,
          time: `${String(Math.floor(time.start/60)).padStart(2,'0')}:${String(time.start%60).padStart(2,'0')} - ${String(Math.floor(time.end/60)).padStart(2,'0')}:${String(time.end%60).padStart(2,'0')}`
        };
      }
    }
  }

  return null;
}

function getSubjectSummary() {
  const subjects = {};
  Object.entries(state.schoolSchedule).forEach(([key, cell]) => {
    if (!subjects[cell.subject]) {
      subjects[cell.subject] = { ...cell, hours: 0 };
    }
    subjects[cell.subject].hours++;
  });
  return Object.values(subjects);
}

// ==================== AI FUNCTIONS ====================

async function sendMessage() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  
  if (!text && state.uploadedImages.length === 0) {
    showToast('اكتب رسالة أو أرفق صورة');
    return;
  }

  if (!state.geminiApiKey) {
    showToast('يرجى إعداد مفتاح API أولاً');
    navigate('dashboard');
    return;
  }

  const userMsg = {
    role: 'user',
    text: text || 'حلل هذه الصورة',
    images: [...state.uploadedImages],
    timestamp: Date.now()
  };
  state.aiMessages.push(userMsg);
  
  input.value = '';
  state.uploadedImages = [];
  render();

  const messages = document.getElementById('aiMessages');
  messages.scrollTop = messages.scrollHeight;

  const loadingId = 'loading-' + Date.now();
  messages.innerHTML += `
    <div class="message ai" id="${loadingId}">
      <div class="message-avatar">🤖</div>
      <div class="message-content">
        <div class="loading"></div> جاري التفكير...
      </div>
    </div>
  `;
  messages.scrollTop = messages.scrollHeight;

  let prompt = `أنت مساعد تعليمي ذكي لطلاب السنة الثانية ثانوي في الجزائر (شعبة تسيير واقتصاد - Division 2G1). أجب باللغة العربية بوضوح ودقة. مستوى الإجابة يجب أن يكون مناسباً لتلميذ في السنة الثانية ثانوي.\n\n`;
  
  if (userMsg.images && userMsg.images.length > 0) {
    prompt += `حلل هذه الصورة/التمرين وأعطِ:\n1. فهم محتوى الصورة\n2. حل التمرين خطوة بخطوة إذا كان تمريناً\n3. شرح المفاهيم المستخدمة\n4. نصائح للمراجعة\n\n`;
  }
  
  if (text) {
    prompt += `سؤال الطالب: ${text}`;
  }

  const imagesData = state.uploadedImages.map(img => {
    const base64 = img.split(',')[1];
    const type = img.split(';')[0].split(':')[1];
    return { data: base64, type };
  });

  const response = await callGeminiAPI(prompt, imagesData);

  document.getElementById(loadingId)?.remove();

  const aiMsg = {
    role: 'ai',
    text: response.error || response.text,
    timestamp: Date.now()
  };
  state.aiMessages.push(aiMsg);
  saveMessages();
  render();
}

function handleImageUpload(event) {
  const files = event.target.files;
  
  for (const file of files) {
    if (file.size > 5 * 1024 * 1024) {
      showToast('حجم الصورة كبير جداً (الحد الأقصى 5MB)');
      continue;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      state.uploadedImages.push(e.target.result);
      renderImagePreview();
    };
    reader.readAsDataURL(file);
  }
}

function renderImagePreview() {
  const preview = document.getElementById('imagePreview');
  if (!preview) return;
  preview.innerHTML = state.uploadedImages.map((img, idx) => `
    <div class="image-preview-item">
      <img src="${img}">
      <button class="remove-btn" onclick="removeImage(${idx})">×</button>
    </div>
  `).join('');
}

function removeImage(idx) {
  state.uploadedImages.splice(idx, 1);
  renderImagePreview();
}

function clearChat() {

function exportData() {
  const data = {
    schoolSchedule: state.schoolSchedule,
    homeSchedule: state.homeSchedule,
    aiMessages: state.aiMessages,
    completedLessons: state.completedLessons,
    bookmarks: state.bookmarks,
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nokhba-2g1-backup-${Date.now()}.json`;
  a.click();
  showToast('✓ تم التصدير');
}
