try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.subjects){S=defaults();firstRun=true;save()}
else migrate();

function migrate(){
  let dirty=false;
  if(!S.v||S.v<4){
    S.ledger=S.ledger||[];S.studyHistory=S.studyHistory||[];S.focusSessions=S.focusSessions||[];
    S.notifications=S.notifications||[];S.reminders=S.reminders||[];S.homeSchedule=S.homeSchedule||[];
    S.dailyGoal=S.dailyGoal||{min:CFG.DAILY_GOAL_MIN,xpGiven:null};
    S.weeklyGoal=S.weeklyGoal||{min:CFG.WEEKLY_GOAL_MIN,xpGiven:null};
    S.subjects.forEach(s=>{s.lessons.forEach(normLesson);s.exercises.forEach(normEx)});
    S.tasks.forEach(normTask);S.exams.forEach(normExam);
    S.notes.forEach(n=>{n.xpDone=!!n.xpDone});
    S.homeSchedule.forEach(h=>{h.xpDone=!!h.xpDone});
    if(!S.timetable['الجمعة'])S.timetable['الجمعة']=[];
    if(!S.timetable['السبت'])S.timetable['السبت']=[];
    Object.keys(S.timetable).forEach(d=>{
      if(Array.isArray(S.timetable[d])&&S.timetable[d].length&&typeof S.timetable[d][0]==='string'){
        S.timetable[d]=S.timetable[d].map((sid,i)=>sid?{sid,start:String(8+i).padStart(2,'0')+':00',end:String(9+i).padStart(2,'0')+':00',teacher:'',room:''}:null).filter(Boolean);
      }
    });
    S.v=CFG.version;dirty=true;
  }
  if(dirty)save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ════════════════════════════════════════════════════════════
   XP SYSTEM — Ledger based
   ════════════════════════════════════════════════════════════ */
const XP = {
  total(){return S.ledger.reduce((a,e)=>a+e.amount,0)},
  recalc(){S.xp=XP.total();save()},
  today(){const t=todayDateStr();return S.ledger.filter(e=>e.at.startsWith(t)).reduce((a,e)=>a+Math.max(0,e.amount),0)},
  thisWeek(){const now=new Date(),s=new Date(now);s.setDate(now.getDate()-6);const s0=dstr(s);return S.ledger.filter(e=>e.at>=s0).reduce((a,e)=>a+Math.max(0,e.amount),0)},
  thisMonth(){const s0=dstr(new Date()).slice(0,7);return S.ledger.filter(e=>e.at.startsWith(s0)).reduce((a,e)=>a+Math.max(0,e.amount),0)},
  award(amount,desc,type,ref){
    if(!amount||amount<=0)return 0;
    if(type&&ref&&S.ledger.some(e=>e.type===type&&e.ref===ref&&e.amount>0))return 0;
    S.ledger.push({id:uid(),amount,desc,type:type||'general',ref:ref||'',at:nowISO()});
    S.xp=XP.total();
    const day=todayDateStr();S.activity[day]=(S.activity[day]||0)+amount;
    save();toast(`⭐ +${amount} XP — ${esc(desc)}`);
    checkBadges();checkDailyGoal();checkWeeklyGoal();
    return amount;
  },
  revoke(amount,desc,type,ref){
    if(!amount||amount<=0)return 0;
    const idx=S.ledger.findIndex(e=>e.type===type&&e.ref===ref&&e.amount>0);
    if(idx<0)return 0;
    S.ledger.push({id:uid(),amount:-amount,desc,type:type||'general',ref:'rev:'+ref,at:nowISO()});
    S.xp=XP.total();save();
    toast(`↩️ -${amount} XP — ${esc(desc)}`,'info');
    return amount;
  }
};

/* ════════════════════════════════════════════════════════════
   LEVEL & STREAK & GOALS
   ════════════════════════════════════════════════════════════ */
function getLevelInfo(xp){
  const lvls=CFG.LEVELS;let cur=lvls[0],next=lvls[1]||null;
  for(let i=0;i<lvls.length;i++){if(xp>=lvls[i].min){cur=lvls[i];next=lvls[i+1]||null}else break;}
  const min=cur.min,max=next?next.min:cur.min+2000;
  const pct=Math.min(100,Math.round((xp-min)/(max-min)*100));
  return {lvl:cur.lvl,title:cur.title,min,max,xp,needed:max-xp,pct,next:next?next.title:null};
}
const lvlInfo=()=>getLevelInfo(S.xp);

function bumpStreak(){
  const t=todayDateStr();
  if(S.streak.activeDays.includes(t))return;
  S.streak.activeDays.push(t);
  const y=dstr(new Date(Date.now()-864e5));
  S.streak.count=(S.streak.last===y)?S.streak.count+1:1;
  S.streak.last=t;S.streak.best=Math.max(S.streak.best,S.streak.count);
  save();syncHUD();
}

function focusMinutesToday(){const t=todayDateStr();return S.focusSessions.filter(f=>f.completed&&f.date===t).reduce((a,f)=>a+f.minutes,0)}
function focusMinutesThisWeek(){const now=new Date(),s=new Date(now);s.setDate(now.getDate()-6);const s0=dstr(s);return S.focusSessions.filter(f=>f.completed&&f.date>=s0).reduce((a,f)=>a+f.minutes,0)}
function checkDailyGoal(){const t=todayDateStr(),min=focusMinutesToday(),target=S.dailyGoal.min;if(min>=target&&S.dailyGoal.xpGiven!==t){S.dailyGoal.xpGiven=t;XP.award(CFG.XP.dailyGoal,'أكملت هدف اليوم 🎯','daily_goal',t);confetti();pushNotif('🎯 أحسنت!','أكملت هدف اليوم الدراسي','gold')}}
function checkWeeklyGoal(){const min=focusMinutesThisWeek(),target=S.weeklyGoal.min;const wk=getWeekKey();if(min>=target&&S.weeklyGoal.xpGiven!==wk){S.weeklyGoal.xpGiven=wk;XP.award(CFG.XP.weeklyGoal,'أكملت هدف الأسبوع 🏆','weekly_goal',wk)}}
function getWeekKey(){const d=new Date(),w=new Date(d);w.setDate(d.getDate()-d.getDay());return dstr(w)}

const subj=id=>S.subjects.find(s=>s.id===id);
function findLesson(id){for(const s of S.subjects){const l=s.lessons.find(x=>x.id===id);if(l)return{s,l}}}
function findEx(id){for(const s of S.subjects){const x=s.exercises.find(e=>e.id===id);if(x)return{s,x}}}
const prog=s=>s.lessons.length?s.lessons.filter(l=>l.done).length/s.lessons.length:0;
const countL=()=>S.subjects.reduce((a,s)=>a+s.lessons.filter(l=>l.done).length,0);
const countLT=()=>S.subjects.reduce((a,s)=>a+s.lessons.length,0);
const countX=()=>S.subjects.reduce((a,s)=>a+s.exercises.filter(x=>x.done).length,0);
const countXT=()=>S.subjects.reduce((a,s)=>a+s.exercises.length,0);
function achievement(){let w=0,d=0;S.subjects.forEach(s=>{if(!s.lessons.length)return;w+=s.coef;d+=s.coef*prog(s)});return w?Math.round(d/w*100):0}

function pushNotif(title,msg,type='info'){
  S.notifications.unshift({id:uid(),title,msg,type,at:Date.now(),read:false});
  if(S.notifications.length>50)S.notifications=S.notifications.slice(0,50);
  save();syncBell();
  if(S.profile.notif&&'Notification' in window&&Notification.permission==='granted'){
    try{new Notification(title,{body:msg})}catch(e){}
  }
}
function unreadNotifs(){return S.notifications.filter(n=>!n.read).length}
function syncBell(){
  const n=unreadNotifs();
  const bm=$('#bell-m-n');if(bm){bm.textContent=n;bm.hidden=n===0}
  const navBell=$('#snav .navi[data-id="notifs"]');
  if(navBell){let b=navBell.querySelector('.bdg');if(!b){b=document.createElement('span');b.className='bdg';navBell.appendChild(b)}b.textContent=n;b.hidden=n===0}
}

let alarmAudio=null;
function playAlarmSound(){try{if(!alarmAudio)alarmAudio=new(window.AudioContext||window.webkitAudioContext)();const ctx=alarmAudio;[880,1100,880].forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type='sine';g.gain.value=0.08;o.start(ctx.currentTime+i*0.35);o.stop(ctx.currentTime+i*0.35+0.3)})}catch(e){}}
function checkReminders(){
  const now=new Date(),curMin=now.getHours()*60+now.getMinutes(),today=todayDateStr();
  S.reminders.forEach(r=>{
    if(r.fired||r.date!==today)return;
    const [h,m]=(r.time||'').split(':').map(Number);
    if(h*60+m<=curMin){r.fired=true;save();if(S.profile.sound)playAlarmSound();pushNotif('⏰ '+esc(r.title),'حان وقت: '+esc(r.title),'gold');showAlarm(r)}
  });
}
function showAlarm(r){
  $('#alarm-root').innerHTML=`<div class="alarm-box">
    <div style="font-size:52px">⏰</div>
    <h2>حان الوقت!</h2>
    <div class="alarm-big">${esc(r.time||'')}</div>
    <p class="alarm-msg">${esc(r.title)}</p>
    <div class="frow" style="justify-content:center">
      <button class="btn btn-ghost" data-act="alarm-snooze" data-id="${r.id}">😴 بعد 5 دقائق</button>
      <button class="btn" data-act="alarm-dismiss" data-id="${r.id}">✓ تم</button>
    </div>
  </div>`;
  $('#alarm-root').classList.add('open');
}

/* ════════════════════════════════════════════════════════════
   FOCUS MODE
   ════════════════════════════════════════════════════════════ */
const FOCUS={
  on:false,paused:false,totalSec:0,remainSec:0,startAt:0,pausedAt:0,
  timer:null,subject:null,goal:'',linkedTask:null,xpAtEnd:0,
  start(minutes,subjectId,goal,taskId){
    if(this.on){toast('⏱️ لديك جلسة نشطة','info');return}
    this.on=true;this.paused=false;this.totalSec=minutes*60;this.remainSec=this.totalSec;
    this.startAt=Date.now();this.subject=subjectId?subj(subjectId):null;
    this.goal=goal||'';this.linkedTask=taskId||null;
    this.xpAtEnd=Math.round(minutes*CFG.XP.focusPerMin);
    $('#focus-ov').classList.add('open');
    $('#fo-sub').textContent=this.subject?`${this.subject.emoji} ${this.subject.name}`:'جلسة تركيز';
    $('#fo-goal').textContent=this.goal?'الهدف: '+this.goal:'';
    this.tick();this.timer=setInterval(()=>this.tick(),500);
    pushNotif('⏱️ بدأت جلسة تركيز',`${minutes} دقيقة`,'info');
  },
  tick(){
    if(this.paused)return;
    const elapsed=Math.floor((Date.now()-this.startAt)/1000);
    this.remainSec=Math.max(0,this.totalSec-elapsed);
    $('#fo-time').textContent=fmtTime(this.remainSec);
    $('#fo-bar').style.width=(this.remainSec/this.totalSec*100)+'%';
    if(this.remainSec<=0)this.complete();
  },
  pause(){
    if(!this.on)return;
    this.paused=!this.paused;
    if(this.paused){this.pausedAt=Date.now();$('#fo-pause').innerHTML='▶ استئناف'}
    else{this.startAt+=Date.now()-this.pausedAt;$('#fo-pause').innerHTML='⏸ إيقاف مؤقت'}
  },
  finish(){
    if(!this.on)return;
    const elapsedSec=Math.max(0,this.totalSec-this.remainSec);
    this.close(true,elapsedSec);
  },
  cancel(){
    if(!this.on)return;
    askConfirm('إلغاء الجلسة؟ لن تحصل على XP.','focus-cancel-confirm','x');
  },
  cancelConfirm(){
    const elapsedSec=Math.max(0,this.totalSec-this.remainSec);
    S.focusSessions.push({id:uid(),date:todayDateStr(),subjectId:this.subject?.id||null,goal:this.goal,minutes:Math.floor(elapsedSec/60),completed:false,at:nowISO()});
    save();this.close(false,elapsedSec);
    toast('⏹️ ألغيت الجلسة — لم تحصل على XP','info');
  },
  complete(){
    if(!this.on)return;
    const min=Math.floor(this.totalSec/60);
    S.focusSessions.push({id:uid(),date:todayDateStr(),subjectId:this.subject?.id||null,goal:this.goal,minutes:min,completed:true,at:nowISO()});
    save();
    XP.award(this.xpAtEnd,`جلسة تركيز ${min}د ⏱️`,'focus',uid());
    bumpStreak();
    pushNotif('🎉 أحسنت!',`أنهيت جلسة ${min} دقيقة وربحت +${this.xpAtEnd} XP`,'gold');
    if(S.profile.sound)playAlarmSound();
    if(this.linkedTask){
      const t=S.tasks.find(x=>x.id===this.linkedTask);
      if(t)modal({title:'هل أكملت المهمة؟',body:`<p class="vs" style="margin-bottom:14px">انتهت جلسة التركيز المرتبطة بمهمة: <b>${esc(t.title)}</b></p><div class="frow end"><button class="btn btn-ghost" data-act="close-modal">لا، أبقى غير مكتملة</button><button class="btn" data-act="finish-linked-task" data-id="${t.id}">✓ نعم، أكمل المهمة</button></div>`});
    }
    this.close(true,this.totalSec);confetti();
  },
  close(){this.on=false;clearInterval(this.timer);this.timer=null;$('#focus-ov').classList.remove('open');refresh()}
};

/* ════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════ */
function scheduleNextReview(l){
  const step=(l.reviewStep||0);
  const days=CFG.STREAK_INTERVALS[Math.min(step,CFG.STREAK_INTERVALS.length-1)];
  l.nextReview=dstr(new Date(Date.now()+days*864e5));l.reviewStep=step+1;l.lastReviewAt=todayDateStr();
}
function lessonsDueToday(){
  const t=todayDateStr();const out=[];
  S.subjects.forEach(s=>s.lessons.forEach(l=>{if(l.done&&l.nextReview&&l.nextReview<=t)out.push({s,l})}));
  return out;
}

];
function checkBadges(){
  const news=BADGES.filter(b=>!S.badges.includes(b.id)&&b.t());
  if(!news.length)return;
  news.forEach(b=>S.badges.push(b.id));save();
  news.forEach(b=>{toast(`${b.i} وسام جديد: ${b.n}`,'badge');pushNotif('🏅 وسام جديد!',b.n,'gold')});
  confetti();
}

/* ════════════════════════════════════════════════════════════
   UI HELPERS
   ════════════════════════════════════════════════════════════ */
function toast(msg,type='ok'){
  const t=document.createElement('div');t.className='toast '+type;t.innerHTML=msg;
  $('#toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('in'));
  setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),320)},3400);
}
function confetti(){
  const c=$('#confetti'),cols=['#0B8A63','#E3A63C','#D6484F','#3563C4','#7C5CD6'];
  for(let i=0;i<38;i++){const p=document.createElement('i');p.style.cssText=`--x:${Math.random()*100}%;--d:${(.9+Math.random()*1.5).toFixed(2)}s;background:${cols[i%5]}`;c.appendChild(p)}
  setTimeout(()=>c.innerHTML='',2800);
}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.07;o.start();o.stop(c.currentTime+.4)}catch(e){}}

/* ═══ إصلاح الـ MODAL: إزالة stopPropagation ═══ */
function modal({title,body}){
  $('#modal-root').innerHTML=`<div class="ovl" id="modal-ovl"><div class="dlg"><div class="dlg-h"><h3>${title}</h3><button class="icon-btn mini" data-act="close-modal">${IC('x')}</button></div><div class="dlg-b">${body}</div></div></div>`;
}
const closeModal=()=>$('#modal-root').innerHTML='';
function askConfirm(msg,act,id){
  modal({title:'تأكيد',body:`<p style="margin-bottom:16px">${msg}</p><div class="frow end"><button class="btn btn-ghost" data-act="close-modal">إلغاء</button><button class="btn btn-danger" data-act="${act}" data-id="${id}">${IC('trash')} حذف</button></div>`});
}
function ring(p,size,sw,track,stroke){const r=(size-sw)/2,c=2*Math.PI*r;return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(p,100)/100)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function counters(){$$('[data-count]').forEach(el=>{const end=+el.dataset.count,suf=el.dataset.suffix||'';const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/780);el.textContent=Math.round(end*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(f)})(t0)})}
function weekChart(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=dstr(d);days.push({k,v:S.activity[k]||0,l:d.toLocaleDateString('ar-DZ',{weekday:'short'}),now:i===0})}
  const max=Math.max(...days.map(d=>d.v),1);
  return`<div class="wchart">${days.map(d=>`<div class="wc-col" title="${d.k} — ${d.v} XP"><span class="wc-v">${d.v||''}</span><i class="wc-bar ${d.now?'now':''}" style="--h:${Math.max(6,d.v/max*100)}%"></i><span class="wc-l">${d.l}</span></div>`).join('')}</div>`}
function applyTheme(t,q){S.theme=t;document.documentElement.dataset.theme=t;save();syncHUD();if(cur.name==='settings'&&!q)refresh()}
function syncHUD(){
  $('#me-name').textContent=S.profile.name||'طالب ثانوي';
  const info=lvlInfo();$('#me-lvl').textContent=`المستوى ${info.lvl} • ${info.title}`;
  $('#sp').textContent='🔥 '+S.streak.count;
  const d=S.theme==='dark';
  $('#th-d').innerHTML=d?'☀️ الوضع الفاتح':'🌙 الوضع الداكن';
  $('#th-m').textContent=d?'☀️':'🌙';
  syncBell();
}
function timeAgo(at){const d=Date.now()-at;if(d<60000)return'الآن';if(d<3600000)return Math.floor(d/60000)+' د';if(d<86400000)return Math.floor(d/3600000)+' س';return Math.floor(d/86400000)+' يوم'}

function route(){
  const h=(location.hash||'#dashboard').slice(1),parts=h.split('/');
  const name=routes[parts[0]]?parts[0]:'dashboard';
  cur={name,arg:parts[1]||null};
  if((name==='subject'||name==='lesson')&&cur.arg){S.last=name==='lesson'?(findLesson(cur.arg)||{s:{id:null}}).s?.id:cur.arg;if(S.last)save()}
  $('#view').innerHTML=routes[name]();
  afterRender();setActive();window.scrollTo({top:0});
}

function rowL(l,s){
  const rev=l.done&&l.doneAt&&((Date.now()-new Date(l.doneAt))/864e5>7);
  const hasSummary=l.summary&&l.summary.length>0;
  return`<div class="row ${l.done?'done':''}">
  <button class="ck ${l.done?'on':''}" data-act="lesson-toggle" data-id="${l.id}" title="إكمال/إلغاء">${IC('check')}</button>
  <div class="r-t">
   <button class="l-open" data-act="open-lesson" data-id="${l.id}">${esc(l.t)} ${IC('chev')}</button>
   <span>${esc(l.u||'')}${s?` • ${s.emoji} ${esc(s.name)}`:''} • ⏱ ${l.dur}د${l.yt?' • 🎥':''}${hasSummary?' • 📝':''}</span>
  </div>
  ${rev?'<span class="chip warn">🔁 مراجعة</span>':''}
  ${hasSummary?'<span class="lesson-summary-badge">📝 ملخص</span>':''}
  ${!l.done&&l.prog>0?`<span class="chip">${l.prog}%</span>`:''}
  ${!l.done&&!rev?`<span class="chip">+${CFG.XP.lesson} XP</span>`:''}</div>`}
function rowX(x,s){
  const dc={سهل:'chip',متوسط:'chip warn',صعب:'chip hot'};
  return`<div class="row ${x.done?'done':''}"><button class="ck ${x.done?'on':''}" data-act="ex-toggle" data-id="${x.id}">${IC('check')}</button><div class="r-t"><b>${esc(x.t)}</b>${s?`<span>${s.emoji} ${esc(s.name)}</span>`:''}</div><span class="${dc[x.d]||'chip'}">${x.d}</span>${!x.done?`<span class="chip">+${CFG.XP.exercise} XP</span>`:''}<button class="icon-btn mini" data-act="del-ex" data-id="${x.id}">${IC('trash')}</button></div>`}
function taskRow(t){
  const pc={high:'var(--red)',med:'var(--gold)',low:'var(--green)'};const s=subj(t.sid);
  return`<div class="row ${t.done?'done':''}"><button class="ck ${t.done?'on':''}" data-act="task-toggle" data-id="${t.id}">${IC('check')}</button><span class="pri" style="background:${pc[t.p]||'var(--green)'}"></span><div class="r-t"><b>${esc(t.title)}</b><span>${s?s.emoji+' '+esc(s.name):'🗂️ عام'} • ${t.day}</span></div>
  ${!t.done?`<span class="chip">+${CFG.XP.task} XP</span>`:''}
  <button class="btn btn-soft sm2" data-act="focus-task" data-id="${t.id}">⏱️ تركيز</button>
  <button class="icon-btn mini" data-act="del-task" data-id="${t.id}">${IC('trash')}</button></div>`}
function examCard(e){
  const s=subj(e.subjectId)||{name:'محذوفة',emoji:'❔',color:'#93A1BA'};const dl=daysLeft(e.date);let when;
  if(e.status==='done')when=`<span class="chip ok">انتهى • ${e.score!=null?e.score+'/20':'-'}</span>`;
  else if(dl<0)when=`<span class="chip hot">⚠️ انقضى</span>`;
  else if(dl<=3)when=`<span class="chip hot">${dl===0?'🚨 اليوم':dl===1?'غدًا':'بعد '+dl+' أيام'}</span>`;
  else when=`<span class="chip">بعد ${dl} يومًا</span>`;
  const dt=new Date(e.date);
  return`<div class="row" style="--sc:${s.color}"><div class="ex-date"><b>${dt.toLocaleDateString('ar-DZ',{day:'numeric'})}</b><span>${dt.toLocaleDateString('ar-DZ',{month:'short'})}</span></div><div class="r-t"><b>${esc(e.title||s.name)}</b><span>${s.emoji} ${esc(s.name)} • ${e.type}</span></div>${when}${e.status==='planned'?`<button class="btn btn-soft sm2" data-act="exam-score" data-id="${e.id}">النتيجة</button>`:''}<button class="icon-btn mini" data-act="del-exam" data-id="${e.id}">${IC('trash')}</button></div>`}
function noteCard(n){
  return`<div class="note c-${n.color} ${n.pinned?'pin':''}"><div class="n-h"><b>${esc(n.title)}</b><button class="icon-btn mini ${n.pinned?'pinned':''}" data-act="note-pin" data-id="${n.id}">${IC('pin')}</button></div><p>${esc(n.body).replace(/\n/g,'<br>')}</p><div class="n-f"><span>${new Date(n.at).toLocaleDateString('ar-DZ',{day:'numeric',month:'short'})}</span><span class="frow" style="gap:5px"><button class="icon-btn mini" data-act="note-edit" data-id="${n.id}">${IC('pen')}</button><button class="icon-btn mini" data-act="del-note" data-id="${n.id}">${IC('trash')}</button></span></div></div>`}

/* ════════════════════════════════════════════════════════════
   DASHBOARD
   ════════════════════════════════════════════════════════════ */
function smartNow(){
  const now=new Date(),minNow=now.getHours()*60+now.getMinutes();
  const day=now.toLocaleDateString('ar-DZ',{weekday:'long'});
  const school=(S.timetable[day]||[]).find(c=>{if(!c||!c.start)return false;const [h1,m1]=c.start.split(':').map(Number),[h2,m2]=c.end.split(':').map(Number);return minNow>=h1*60+m1&&minNow<h2*60+m2});
  const home=(S.homeSchedule||[]).filter(x=>x.day===day||x.repeat==='daily').find(x=>{const [h1,m1]=x.start.split(':').map(Number),[h2,m2]=x.end.split(':').map(Number);return minNow>=h1*60+m1&&minNow<h2*60+m2});
  if(school){const s=subj(school.sid);return{type:'school',icon:'🏫',title:'لديك حصة الآن',sub:s?`${s.emoji} ${esc(s.name)}`:'حصة',sub2:`من ${school.start} إلى ${school.end}`}}
  if(home){const s=subj(home.sid);return{type:'home',icon:'📚',title:'لديك جلسة مراجعة الآن',sub:s?`${s.emoji} ${esc(s.name)}`:esc(home.name),sub2:`${home.start} — ${home.end}`}}
  return{type:'none',icon:'🎯',title:'ماذا تريد أن تدرس الآن؟',sub:'اختر مادة أو ابدأ جلسة تركيز'};
}

const CHIPS=[['📊 حلل مستواي','حلل مستواي'],['🧠 كويزات','كويزات'],['🗓️ خطة','خطة ذكية'],['💡 نصيحة','نصيحة'],['🔥 تحفيز','تحفيز'],['⏱️ بومودورو','بومودورو'],['🌍 عاصمة اليابان','عاصمة اليابان'],['💻 شرح JavaScript','شرح JavaScript'],['✍️ اكتب لي رسالة','اكتب لي رسالة'],['🧮 25×4','25×4']];
let quizSession={active:false,questions:[],currentIdx:0,score:0,target:'chat',src:null};

async function callAIProvider(msg){
  await new Promise(r=>setTimeout(r,100));
  return localAIEngine(msg);
}
function localAIEngine(txt){
  const t=txt.replace(/[\u064B-\u0652]/g,'').toLowerCase();
  if(quizSession.active&&quizSession.target==='chat'&&!/(إيقاف|توقف)/.test(t)&&!/كويز|اختبر/.test(t))return'نحن في منتصف الكويز! أجب على السؤال أو اكتب «إيقاف».';
  if(/(إيقاف|توقف)/.test(t)&&quizSession.active){quizSession.active=false;return'تم إيقاف الكويز ⏹️'}
  const calcMatch=txt.match(/(\d+(?:\.\d+)?)\s*([+\-*/x×÷^])\s*(\d+(?:\.\d+)?)/);
  if(calcMatch){const a=+calcMatch[1],op=calcMatch[2],b=+calcMatch[3];let r=null;if(op==='+')r=a+b;else if(op==='-')r=a-b;else if(op==='*'||op==='x'||op==='×')r=a*b;else if(op==='/'||op==='÷')r=b?a/b:'غير معرف';else if(op==='^')r=Math.pow(a,b);if(r!==null)return`🧮 ${a} ${op} ${b} = <b>${typeof r==='number'?Math.round(r*10000)/10000:r}</b>`}
  const capitals={'اليابان':'طوكيو 🇯🇵','فرنسا':'باريس 🇫🇷','الجزائر':'الجزائر العاصمة 🇩🇿','مصر':'القاهرة 🇪🇬','المغرب':'الرباط 🇲🇦','السعودية':'الرياض 🇸🇦','تركيا':'أنقرة 🇹🇷','ألمانيا':'برلين 🇩🇪','أمريكا':'واشنطن 🇺🇸'};
  for(const [c,cap] of Object.entries(capitals)){if(t.includes(c))return`🌍 عاصمة <b>${c}</b> هي <b>${cap}</b>`}
  if(/(حلل|مستواي)/.test(t))return analyzeProgress();
  if(/(ماذا أدرس|اقترح)/.test(t))return suggestStudy();
  if(/(كويز|اختبر)/.test(t)){const match=t.match(/في\s*(.+)/);let filter=null;if(match){const found=S.subjects.find(s=>s.name.includes(match[1].trim()));if(found)filter=found.id}return generateQuiz(filter,'chat')}
  if(/(خطة|برنامج)/.test(t))return planHTML();
  if(/(ملخص|لخص)/.test(t))return summaryHTML(t);
  if(/(javascript|js)\b/.test(t))return`<b>💻 JavaScript</b> — لغة الويب:<br>• المتغيرات (let, const)<br>• الدوال والشروط والحلقات<br>• DOM والتفاعل مع الصفحة<br>• ES6+ و async/await<br><br>تعلم من: freeCodeCamp + MDN Docs`;
  if(/\b(html|css)\b/.test(t))return`<b>🌐 HTML و CSS:</b><br>• HTML = الهيكل 🦴<br>• CSS = التصميم 🎨<br>• JavaScript = التفاعل ⚡`;
  if(/(اكتب.*رسالة|رسالة.*زبون)/.test(t))return`✍️ <b>قالب رسالة مهنية:</b><br><br>السيد/السيدة [الاسم]،<br><br>تحية طيبة،<br>نشكركم على تواصلكم. [الموضوع].<br>مع التقدير،<br>[اسمك]`;
  if(/(نصيحة)/.test(t))return`💡 ${pick(TIPS)}`;
  if(/(حماس|تحفيز|تعبت)/.test(t))return`🔥 ${pick(QUOTES)}`;
  if(/(بومودورو|جلسة)/.test(t)){setTimeout(()=>startTimer(25),500);return'⏱️ شغّلت مؤقت 25 دقيقة!'}
  if(/(شكرا)/.test(t))return'العفو! 🤝';
  if(/(سلام|مرحبا|هلا)/.test(t))return`أهلًا ${S.profile.name?'يا '+esc(S.profile.name):''}! 👋`;
  return`🤔 لم أجد إجابة محددة.<br><br>يمكنني مساعدتك في:<br>• الدراسة: «حلل مستواي»، «اختبرني»<br>• الحسابات: «25 × 4»<br>• العواصم: «عاصمة اليابان»<br>• البرمجة: «شرح JavaScript»<br>• الكتابة: «اكتب لي رسالة»`}
function generateQuiz(subjectId,target='chat'){
  let pool=subjectId?QB.filter(q=>q.s===subjectId):[...QB];
  if(!pool.length)pool=[...QB];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  quizSession={active:true,questions:pool.slice(0,Math.min(5,pool.length)),currentIdx:0,score:0,target};
  return renderQuizQuestion()}
function renderQuizQuestion(){
  if(quizSession.currentIdx>=quizSession.questions.length){
    const total=quizSession.questions.length,score=quizSession.score;
    if(score>0)XP.award(score*CFG.XP.quizCorrect,`كويز: ${score}/${total}`,'quiz',uid());
    quizSession.active=false;
    return`<div class="ai-result-card"><h4>🏁 النتيجة: <span class="ai-score">${score}/${total}</span></h4><button class="chip-btn mt" data-act="chip" data-id="كويزات">كويز جديد 🔁</button></div>`}
  const q=quizSession.questions[quizSession.currentIdx],s=subj(q.s);
  return`<div class="quiz"><div class="chip" style="margin-bottom:8px">سؤال ${quizSession.currentIdx+1}/${quizSession.questions.length} • ${s?s.emoji:''}</div><p class="q-txt">${q.q}</p>${q.a.map((o,i)=>`<button class="q-opt" data-act="ai-quiz-ans" data-c="${i}">${o}</button>`).join('')}</div>`}
function quizAdvance(){quizSession.currentIdx++;const html=renderQuizQuestion();const last=[...S.chat].reverse().find(m=>m.r==='ai'&&m.h.includes('q-opt'));if(last){last.h=html;save()}paintChat()}
function analyzeProgress(){let a='<b>📊 تحليل مستواك:</b><br>';let weak=[];S.subjects.forEach(s=>{if(!s.lessons.length)return;if(prog(s)<0.4)weak.push(s)});if(weak.length){a+='<br><span style="color:var(--red)">⚠️ تحتاج تركيز:</span><ul>';weak.forEach(s=>{a+=`<li>${s.emoji} <b>${esc(s.name)}</b>: ${Math.round(prog(s)*100)}%</li>`});a+='</ul>'}else{a+='<br>✅ مستواك جيد! واصل.'}return a}
function suggestStudy(){const ranked=S.subjects.filter(s=>s.lessons.length).map(s=>({s,need:s.coef*(1-prog(s))})).sort((a,b)=>b.need-a.need);if(!ranked.length)return'أضف دروسًا أولًا';const s=ranked[0].s,l=s.lessons.find(x=>!x.done);if(!l)return`أنجزت كل ${esc(s.name)}! 🎉`;return`أنصحك بـ <b>«${esc(l.t)}»</b> في ${s.emoji} ${esc(s.name)}<br><button class="chip-btn" data-act="open-lesson" data-id="${l.id}">📖 افتح</button>`}
function planHTML(){const ranked=S.subjects.filter(s=>s.lessons.length).map(s=>({s,need:s.coef*(1-prog(s))})).sort((a,b)=>b.need-a.need).slice(0,4);if(!ranked.length)return'أضف دروسًا';let h='<b>🗓️ خطة:</b><br>';['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'].forEach((d,i)=>{const o=ranked[i%ranked.length],p=o.s.lessons.find(l=>!l.done);h+=`• <b>${d}:</b> ${o.s.emoji} ${p?'«'+esc(p.t)+'»':'مراجعة'}<br>`});return h}
function summaryHTML(txt){const map=[['اقتصاد','eco'],['قانون','droit'],['محاسبة','cpt'],['تسيير','gest'],['رياضيات','math']];const hit=map.find(([k])=>txt.includes(k));const s=hit?subj(hit[1]):null;if(s&&s.summary)return`<b>📌 ملخص — ${esc(s.name)}</b><ul>${s.summary.map(li=>`<li>${li}</li>`).join('')}</ul>`;return'ملخصات متاحة في: الاقتصاد، القانون، المحاسبة، التسيير، الرياضيات'}
async function sendChat(txt){
  txt=(txt||'').trim();if(!txt)return;
  S.chat.push({r:'me',h:esc(txt),at:Date.now()});
  if(S.chat.length>80)S.chat=S.chat.slice(-80);save();paintChat();
  const inp=$('#chat-txt');if(inp){inp.value='';inp.style.height='44px'}
  showTyping();
  const response=await callAIProvider(txt);
  removeTyping();
  pushAI(response);
}
function paintChat(){const log=$('#chat-log');if(!log)return;log.innerHTML=S.chat.map((m,i)=>{const acts=m.r==='ai'?`<div class="m-acts"><button data-act="copy-msg" data-id="${i}">📋 نسخ</button><button data-act="regen-msg" data-id="${i}">🔄 إعادة</button></div>`:'';return`<div class="msg ${m.r}">${m.r==='ai'?'<span class="m-av">✨</span>':'<span class="m-av">👤</span>'}<div class="m-col"><div class="m-bb">${m.h}</div>${acts}</div></div>`}).join('');log.scrollTop=log.scrollHeight}
function pushAI(h){S.chat.push({r:'ai',h,at:Date.now()});if(S.chat.length>80)S.chat=S.chat.slice(-80);save();paintChat()}
function showTyping(){const log=$('#chat-log');if(!log)return;const d=document.createElement('div');d.className='msg ai';d.id='typing';d.innerHTML='<span class="m-av">✨</span><div class="m-col"><div class="m-bb typing"><i></i><i></i><i></i></div></div>';log.appendChild(d);log.scrollTop=log.scrollHeight}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove()}
function renderAI(){return`<div class="vhead"><div><h1 class="vt">المساعد الذكي ✨</h1><p class="vs">مساعد شخصي عام</p></div><div class="vact"><button class="btn btn-ghost sm2" data-act="clear-chat">${IC('trash')} مسح</button></div></div><div class="card chat-card"><div class="chat-log" id="chat-log"></div><div class="chat-chips">${CHIPS.map(([l,c])=>`<button class="chip-btn" data-act="chip" data-id="${c}">${l}</button>`).join('')}</div><form class="chat-in" data-form="chat"><textarea id="chat-txt" placeholder="اكتب سؤالك… (Enter للإرسال)" rows="1"></textarea><button class="btn send" type="submit">${IC('send')}</button></form></div>`}

function modalHome(id){const h=id?(S.homeSchedule||[]).find(x=>x.id===id):null;modal({title:h?'تعديل جلسة':'جلسة مراجعة',body:`<form data-form="homeCell" class="fcol"><input type="hidden" name="hid" value="${h?h.id:''}"><label>الاسم *<input name="name" required value="${h?esc(h.name||''):''}"></label><label>المادة<select name="sid">${S.subjects.map(s=>`<option value="${s.id}" ${h&&h.sid===s.id?'selected':''}>${s.emoji} ${esc(s.name)}</option>`).join('')}</select></label><div class="frow"><label style="flex:1">اليوم<select name="day">${ARABIC_DAYS.map(d=>`<option ${h&&h.day===d?'selected':(!h&&d===new Date().toLocaleDateString('ar-DZ',{weekday:'long'})?'selected':'')}>${d}</option>`).join('')}</select></label><label style="flex:1">التكرار<select name="repeat"><option value="once" ${h&&h.repeat==='once'?'selected':''}>مرة</option><option value="daily" ${h&&h.repeat==='daily'?'selected':''}>يوميًا</option><option value="weekly" ${!h||h.repeat==='weekly'?'selected':''}>أسبوعيًا</option></select></label></div><div class="frow"><label style="flex:1">البداية<input type="time" name="start" value="${h?h.start:'17:00'}"></label><label style="flex:1">النهاية<input type="time" name="end" value="${h?h.end:'18:00'}"></label></div><label>ملاحظة<textarea name="note" rows="2">${h?esc(h.note||''):''}</textarea></label><button class="btn" type="submit">${IC('check')} حفظ</button></form>`})}

function modalReminder(){modal({title:'منبه جديد ⏰',body:`<form data-form="reminder" class="fcol"><label>العنوان *<input name="title" required></label><div class="frow"><label style="flex:1">التاريخ<input type="date" name="date" required min="${dstr()}" value="${dstr()}"></label><label style="flex:1">الوقت<input type="time" name="time" required value="17:00"></label></div><button class="btn" type="submit">${IC('check')} ضبط</button></form>`})}
function startTimer(min){FOCUS.start(min)}

/* ════════════════════════════════════════════════════════════
   ACTIONS — مع إصلاح الـ X
   ════════════════════════════════════════════════════════════ */
const A={
  'nav'(id){location.hash='#'+id;$('#sheet').classList.remove('open')},
  'theme'(){applyTheme(S.theme==='dark'?'light':'dark')},
  'set-theme'(id){applyTheme(id)},
  'close-modal'(){closeModal()},
  'more-open'(){$('#sheet').classList.add('open')},
  'sheet-close'(){$('#sheet').classList.remove('open')},
  'timer-start'(id){FOCUS.start(+id||25)},
  'focus-start'(){FOCUS.start(25)},
  'focus-pause'(){FOCUS.pause()},
  'focus-finish'(){FOCUS.finish()},
  'focus-cancel'(){FOCUS.cancel()},
  'focus-cancel-confirm'(){closeModal();FOCUS.cancelConfirm()},
  'focus-task'(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;modal({title:'جلسة تركيز للمهمة',body:`<form data-form="focus-from-task" class="fcol"><input type="hidden" name="tid" value="${id}"><label>المدة (دقائق)<input type="number" name="min" min="5" max="240" value="25"></label><label>الهدف<input name="goal" value="${esc(t.title)}"></label><button class="btn" type="submit">▶️ ابدأ</button></form>`})},
  'focus-home'(id){const h=(S.homeSchedule||[]).find(x=>x.id===id);if(!h)return;const [h1,m1]=h.start.split(':').map(Number),[h2,m2]=h.end.split(':').map(Number);FOCUS.start(Math.max(5,(h2*60+m2)-(h1*60+m1)),h.sid,h.name)},
  'finish-linked-task'(id){const t=S.tasks.find(x=>x.id===id);if(t&&!t.done){t.done=true;t.doneAt=todayDateStr();if(!t.xpDone){t.xpDone=true;XP.award(CFG.XP.task,`مهمة: ${t.title}`,'task',t.id)}bumpStreak()}closeModal();refresh()},
  'lesson-toggle'(id){const f=findLesson(id);if(!f)return;const l=f.l;
    if(l.done){l.done=false;l.doneAt=null;if(l.xpDone){l.xpDone=false;XP.revoke(CFG.XP.lesson,`إلغاء: ${l.t}`,'lesson',l.id)}save();refresh()}
    else{l.done=true;l.doneAt=todayDateStr();l.prog=100;if(!l.xpDone){l.xpDone=true;XP.award(CFG.XP.lesson,`درس: ${l.t}`,'lesson',l.id)}bumpStreak();scheduleNextReview(l);save();refresh()}},
  'open-lesson'(id){location.hash='#lesson/'+id},
  'edit-lesson'(id){const f=findLesson(id);if(f)modalLessonEdit(f.l,f.s.id)},
  'del-lesson-ask'(id){askConfirm('حذف هذا الدرس؟','del-lesson',id)},
  'del-lesson'(id){const f=findLesson(id);if(!f)return;f.s.lessons=f.s.lessons.filter(x=>x.id!==id);save();closeModal();toast('🗑️ حُذف','info');location.hash='#subject/'+f.s.id},
  'open-yt'(id){const f=findLesson(id);if(f)openSafe(f.l.yt)},
  'open-ext'(id){const f=findLesson(id);if(f)openSafe(f.l.ext)},
  'flash'(id,el){el.classList.toggle('open')},
  'ls-quiz'(id){const f=findLesson(id);if(!f)return;const box=$('#lsquiz-'+id);if(!box)return;box.innerHTML=generateQuiz(f.s.id,'lsquiz-'+id)},
  'lsex-tog'(id){const[lid,xid]=id.split('|');const f=findLesson(lid);if(!f)return;const x=f.l.lesEx.find(e=>e.id===xid);if(!x)return;if(x.done){x.done=false;if(x.xpDone){x.xpDone=false;XP.revoke(CFG.XP.lesEx,`إلغاء: ${x.t}`,'les_ex',x.id)}save();refresh()}else{x.done=true;if(!x.xpDone){x.xpDone=true;XP.award(CFG.XP.lesEx,`تمرين درس: ${x.t}`,'les_ex',x.id)}bumpStreak();save();refresh()}},
  'lsex-del'(id){const[lid,xid]=id.split('|');const f=findLesson(lid);if(!f)return;f.l.lesEx=f.l.lesEx.filter(e=>e.id!==xid);save();refresh()},
  'ex-toggle'(id){const f=findEx(id);if(!f)return;const x=f.x;if(x.done){x.done=false;x.doneAt=null;if(x.xpDone){x.xpDone=false;XP.revoke(CFG.XP.exercise,`إلغاء: ${x.t}`,'exercise',x.id)}save();refresh()}else{x.done=true;x.doneAt=todayDateStr();if(!x.xpDone){x.xpDone=true;XP.award(CFG.XP.exercise,`تمرين: ${x.t}`,'exercise',x.id)}bumpStreak();save();refresh()}},
  'del-ex'(id){const f=findEx(id);if(!f)return;f.s.exercises=f.s.exercises.filter(x=>x.id!==id);save();refresh()},
  'task-toggle'(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;if(t.done){t.done=false;t.doneAt=null;if(t.xpDone){t.xpDone=false;XP.revoke(CFG.XP.task,`إلغاء: ${t.title}`,'task',t.id)}save();refresh()}else{t.done=true;t.doneAt=todayDateStr();if(!t.xpDone){t.xpDone=true;XP.award(CFG.XP.task,`مهمة: ${t.title}`,'task',t.id)}bumpStreak();save();refresh()}},
  'del-task'(id){S.tasks=S.tasks.filter(t=>t.id!==id);save();refresh()},
  'home-done'(id){const h=(S.homeSchedule||[]).find(x=>x.id===id);if(!h)return;h.done=true;if(!h.xpDone){h.xpDone=true;XP.award(10,`جلسة مراجعة: ${h.name}`,'home',id+':'+todayDateStr())}bumpStreak();save();refresh()},
  'home-undone'(id){const h=(S.homeSchedule||[]).find(x=>x.id===id);if(!h)return;h.done=false;if(h.xpDone){h.xpDone=false;XP.revoke(10,`إلغاء: ${h.name}`,'home',id+':'+todayDateStr())}save();refresh()},
  'home-edit'(id){modalHome(id)},
  'home-add'(day){modalHome(null);setTimeout(()=>{const d=$('#modal-root [name=day]');if(d&&day)d.value=day},100)},
  'home-del'(id){askConfirm('حذف الجلسة؟','home-del-confirm',id)},
  'home-del-confirm'(id){S.homeSchedule=S.homeSchedule.filter(x=>x.id!==id);save();closeModal();refresh()},
  'del-exam'(id){S.exams=S.exams.filter(e=>e.id!==id);save();refresh()},
  'exam-score'(id){modalScore(id)},
  'del-note'(id){S.notes=S.notes.filter(n=>n.id!==id);save();refresh()},
  'note-pin'(id){const n=S.notes.find(x=>x.id===id);n.pinned=!n.pinned;save();refresh()},
  'note-edit'(id){modalNote(S.notes.find(x=>x.id===id))},
  'm-subject'(){modalSubject()},
  'm-lesson'(id){modalLessonEdit(null,id)},
  'm-exercise'(id){modalExercise(id||null)},
  'm-exam'(id){modalExam(id||null)},
  'm-task'(){modalTask()},
  'm-note'(){modalNote()},
  'm-reminder'(){modalReminder()},
  'tt-edit'(id){const[day,slot]=id.split('|');modalTT(day,+slot)},
  'tt-add'(day){modalTT(day)},
  'del-subject-ask'(id){const s=subj(id);askConfirm(`حذف «${esc(s.name)}»؟`,'del-subject',id)},
  'del-subject'(id){S.subjects=S.subjects.filter(s=>s.id!==id);save();closeModal();location.hash='#subjects'},
  'tab'(id,el){$$('[data-sec]').forEach(s=>s.hidden=s.dataset.sec!==id);$$('.tabbtn').forEach(b=>b.classList.toggle('on',b===el))},
  'ef'(id){EF=id;const w=$('#exams-wrap');if(w)w.innerHTML=examsWrap()},
  'xf'(id){XF=id;const w=$('#ex-wrap');if(w)w.innerHTML=exWrapHTML()},
  'tf'(id){TF=id;const w=$('#tasks-wrap');if(w)w.innerHTML=tasksWrap()},
  'chip'(id){if(cur.name!=='ai')location.hash='#ai';setTimeout(()=>sendChat(id),cur.name==='ai'?0:150)},
  'quiz-start'(){sendChat('كويزات')},
  'clear-chat'(){askConfirm('مسح المحادثة؟','clear-chat-confirm','x')},
  'clear-chat-confirm'(){S.chat=[{r:'ai',h:AI_WELCOME,at:Date.now()}];save();closeModal();if(cur.name==='ai')refresh()},
  'copy-msg'(idx){const m=S.chat[+idx];if(!m)return;const text=m.h.replace(/<[^>]+>/g,'');navigator.clipboard?.writeText(text).then(()=>toast('📋 تم النسخ','info')).catch(()=>toast('تعذر','err'))},
  'regen-msg'(idx){const i=+idx;const userMsg=S.chat[i-1];if(!userMsg||userMsg.r!=='me')return;S.chat.splice(i,1);save();paintChat();showTyping();callAIProvider(userMsg.h.replace(/<[^>]+>/g,'')).then(r=>{removeTyping();pushAI(r)})},
  'ai-quiz-ans'(id,el){
    if(!quizSession.active)return;
    const chosen=+el.dataset.c,q=quizSession.questions[quizSession.currentIdx],ok=chosen===q.c;
    if(ok)quizSession.score++;
    S.quizStats.answered++;if(ok)S.quizStats.correct++;save();checkBadges();
    const box=el.parentElement;
    box.querySelectorAll('.q-opt').forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('ok');else if(i===chosen)b.classList.add('bad')});
    if(ok)toast('✅ صحيحة!','info');
    const nb=document.createElement('button');nb.className='btn btn-soft sm2';nb.style.width='100%';nb.style.marginTop='10px';
    nb.textContent=quizSession.currentIdx<quizSession.questions.length-1?'السؤال التالي ←':'النتيجة 🏆';
    nb.onclick=quizAdvance;box.appendChild(nb)},
  'mark-read'(id){const n=S.notifications.find(x=>x.id===id);if(n){n.read=true;save();syncBell();if(cur.name==='notifs')refresh()}},
  'mark-all-read'(){S.notifications.forEach(n=>n.read=true);save();syncBell();refresh()},
  'del-notif'(id){S.notifications=S.notifications.filter(n=>n.id!==id);save();syncBell();refresh()},
  'clear-notifs'(){askConfirm('مسح كل الإشعارات؟','clear-notifs-confirm','x')},
  'clear-notifs-confirm'(){S.notifications=[];save();closeModal();syncBell();refresh()},
  'alarm-dismiss'(id){$('#alarm-root').classList.remove('open');$('#alarm-root').innerHTML=''},
  'alarm-snooze'(id){const r=S.reminders.find(x=>x.id===id);if(r){r.fired=false;const [h,m]=r.time.split(':').map(Number);const d=new Date();d.setHours(h,m+5,0);r.time=pad2(d.getHours())+':'+pad2(d.getMinutes());save()}$('#alarm-root').classList.remove('open');$('#alarm-root').innerHTML='';toast('😴 بعد 5 دقائق','info')},
  'toggle-sound'(id,el){S.profile.sound=el.target.checked;save()},
  'toggle-notif'(id,el){S.profile.notif=el.target.checked;save()},
  'request-notif'(){if(!('Notification' in window))return toast('غير مدعوم','err');Notification.requestPermission().then(p=>{toast(p==='granted'?'✅ مفعّل':'❌ مرفوض',p==='granted'?'ok':'err');if(cur.name==='settings')refresh()})},
  'export'(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='studyhub-backup-'+todayDateStr()+'.json';a.click();toast('💾 تم التصدير','info')},
  'import-btn'(){$('#imp').click()},
  'ask-reset-progress'(){askConfirm('حذف كل التقدم (XP، الأوسمة، السجل)؟ المواد والدروس تبقى.','reset-progress','x')},
  'reset-progress'(){S.ledger=[];S.xp=0;S.streak={count:0,last:null,best:0,activeDays:[]};S.badges=[];S.studyHistory=[];S.focusSessions=[];S.activity={};S.subjects.forEach(s=>{s.lessons.forEach(l=>{l.done=false;l.doneAt=null;l.xpDone=false;l.prog=0;l.lesEx.forEach(x=>{x.done=false;x.xpDone=false})});s.exercises.forEach(x=>{x.done=false;x.xpDone=false})});S.tasks.forEach(t=>{t.done=false;t.xpDone=false});S.notes.forEach(n=>n.xpDone=false);S.homeSchedule.forEach(h=>{h.done=false;h.xpDone=false});S.exams.forEach(e=>{e.status='planned';e.score=null;e.xpDone=false});save();closeModal();toast('♻️ تم','info');refresh()},
  'ask-reset-all'(){askConfirm('⚠️ حذف كل البيانات نهائيًا والعودة للبداية. لا يمكن التراجع!','reset-all','x')},
  'reset-all'(){localStorage.removeItem(CFG.storageKey);location.reload()},
  'resume'(){if(S.last)location.hash='#subject/'+S.last},
};

document.addEventListener('click',e=>{
  /* ═══ إصلاح: إغلاق الـ modal عند النقر على الخلفية فقط ═══ */
  if(e.target.id==='modal-ovl'){closeModal();return}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const fn=A[el.dataset.act];
  if(fn)fn(el.dataset.id,el,e);
});

/* ════════════════════════════════════════════════════════════
   FORMS
   ════════════════════════════════════════════════════════════ */
const F={
  subject(f){const name=f.name.value.trim();if(!name)return toast('أدخل الاسم','err');S.subjects.push({id:uid(),name,emoji:f.emoji.value.trim()||'📘',color:f.color.value||'#0B8A63',coef:+f.coef.value||2,lessons:[],exercises:[],summary:null});save();closeModal();toast('✅');refresh()},
  lessonEdit(f){const s=subj(f.sid.value);if(!s)return;const data={t:f.t.value.trim(),u:f.u.value.trim(),dur:Math.max(5,Math.min(240,+f.dur.value||30)),diff:f.diff.value,prog:Math.max(0,Math.min(100,+f.prog.value||0)),desc:f.desc.value.trim(),summary:f.summary.value.trim(),rules:linesOf(f.rules.value),examples:linesOf(f.examples.value),yt:cleanUrl(f.yt.value),ext:cleanUrl(f.ext.value)};if(!data.t)return toast('أدخل العنوان','err');if(f.lid.value){const l=s.lessons.find(x=>x.id===f.lid.value);if(!l)return;Object.assign(l,data);if(l.prog>=100&&!l.done){l.done=true;l.doneAt=todayDateStr();if(!l.xpDone){l.xpDone=true;XP.award(CFG.XP.lesson,`درس: ${l.t}`,'lesson',l.id)}}save();closeModal();toast('✅');refresh()}else{s.lessons.push(normLesson(Object.assign({id:uid(),done:false,doneAt:null,xpDone:false},data)));save();closeModal();toast('📖 أُضيف');refresh()}},
  exercise(f){const s=subj(f.sid.value);if(!s)return toast('اختر المادة','err');s.exercises.push(normEx({id:uid(),t:f.t.value.trim(),d:f.d.value,done:false,doneAt:null,xpDone:false}));save();closeModal();toast('✏️');refresh()},
  exam(f){const sid=f.sid.value,date=f.date.value;if(!sid||!date)return toast('أكمل','err');S.exams.push({id:uid(),subjectId:sid,type:f.type.value,title:f.title.value.trim(),date,status:'planned',score:null,xpDone:false});save();closeModal();toast('📅');refresh()},
  score(f){const e=S.exams.find(x=>x.id===f.eid.value);if(!e)return;e.score=Math.max(0,Math.min(20,+f.v.value||0));e.status='done';if(!e.xpDone){e.xpDone=true;XP.award(CFG.XP.exam,`اختبار: ${e.title||''}`,'exam',e.id)}save();closeModal();if(e.score>=15){toast('🏆 ممتاز!','badge');confetti()}checkBadges();refresh()},
  task(f){S.tasks.push(normTask({id:uid(),title:f.title.value.trim(),sid:f.sid.value,day:f.day.value,p:f.p.value,done:false,doneAt:null,xpDone:false}));save();closeModal();toast('✅');refresh()},
  note(f){const nid=f.nid.value,data={title:f.title.value.trim(),body:f.body.value.trim(),color:f.color.value};if(nid){Object.assign(S.notes.find(n=>n.id===nid),data)}else{const n={id:uid(),...data,pinned:false,at:Date.now(),xpDone:false};S.notes.push(n);if(!n.xpDone){n.xpDone=true;XP.award(CFG.XP.note,'ملاحظة 📝','note',n.id)}}save();closeModal();refresh();checkBadges()},
  lsexAdd(f){const g=findLesson(f.lid.value);if(!g)return;const t=f.t.value.trim();if(!t)return;g.l.lesEx.push({id:uid(),t,done:false,xpDone:false});save();refresh()},
  ttcell(f){const day=f.day.value,slot=f.slot.value,sub=f.sub.value,start=f.start.value,end=f.end.value,teacher=f.teacher.value.trim(),room=f.room.value.trim();if(!sub){if(slot!=='')S.timetable[day].splice(+slot,1)}else if(slot!==''){S.timetable[day][+slot]={sid:sub,start,end,teacher,room}}else{S.timetable[day].push({sid:sub,start,end,teacher,room})}save();closeModal();refresh()},
  homeCell(f){const hid=f.hid.value,data={name:f.name.value.trim(),sid:f.sid.value,day:f.day.value,repeat:f.repeat.value,start:f.start.value,end:f.end.value,note:f.note.value.trim()};if(!data.name)return toast('أدخل الاسم','err');if(hid){Object.assign(S.homeSchedule.find(x=>x.id===hid),data)}else{S.homeSchedule.push(Object.assign({id:uid(),done:false,xpDone:false},data))}save();closeModal();refresh()},
  reminder(f){S.reminders.push({id:uid(),title:f.title.value.trim(),date:f.date.value,time:f.time.value,fired:false,snoozed:0});save();closeModal();toast('⏰ ضُبط');refresh()},
  settings(f){S.profile.name=f.name.value.trim();save();toast('✅');syncHUD();refresh()},
  goals(f){S.dailyGoal.min=Math.max(10,Math.min(480,+f.daily.value||60));S.weeklyGoal.min=Math.max(60,Math.min(3000,+f.weekly.value||300));save();toast('✅');refresh()},
  chat(f){sendChat($('#chat-txt').value)},
  'focus-start'(f){const min=+f.min.value||25;closeModal();FOCUS.start(min,f.sid.value,f.goal.value.trim())},
  'focus-from-task'(f){const t=S.tasks.find(x=>x.id===+f.tid.value);if(!t)return;closeModal();FOCUS.start(+f.min.value||25,t.sid,f.goal.value.trim(),t.id)},
  onboard(f){S.profile.name=f.name.value.trim();S.profile.goal=+f.goal.value||3;save();closeModal();syncHUD();toast(`🚀 أهلًا ${S.profile.name||'يا بطل'}!`,'badge');confetti()},
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=F[f.dataset.form];if(fn)fn(f)});
document.addEventListener('input',e=>{
  if(e.target.id==='lf-q'){LF.q=e.target.value;const el=$('#lf-list');if(el)el.innerHTML=lessonListHTML()}
  if(e.target.id==='nt-q'){NTQ=e.target.value;const el=$('#nt-grid');if(el)el.innerHTML=noteGridHTML()}
  if(e.target.id==='ls-prog'){const pv=$('#pv');if(pv)pv.textContent=e.target.value+'%'}
  if(e.target.id==='chat-txt'){const ta=e.target;ta.style.height='44px';ta.style.height=Math.min(130,ta.scrollHeight)+'px'}
});
document.addEventListener('change',e=>{
  if(e.target.id==='lf-s'||e.target.id==='lf-st'){if(e.target.id==='lf-s')LF.s=e.target.value;else LF.st=e.target.value;const el=$('#lf-list');if(el)el.innerHTML=lessonListHTML()}
  if(e.target.id==='ls-prog'){const f=findLesson(e.target.dataset.id);if(!f)return;const v=+e.target.value;f.l.prog=v;const hb=$('#ls-hpct');if(hb)hb.textContent=Math.max(v,f.l.done?100:0)+'%';if(v>=100&&!f.l.done){f.l.done=true;f.l.doneAt=todayDateStr();if(!f.l.xpDone){f.l.xpDone=true;XP.award(CFG.XP.lesson,`درس: ${f.l.t}`,'lesson',f.l.id)}scheduleNextReview(f.l);bumpStreak();toast('🎉 اكتمل!')}save()}
  if(e.target.id==='imp'){const file=e.target.files[0];if(!file)return;if(!confirm('سيتم استبدال بياناتك. متابعة؟'))return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj.subjects||!obj.profile)throw 0;S=obj;migrate();save();toast('📥 تم','badge');setTimeout(()=>location.reload(),700)}catch(err){toast('❌ ملف غير صالح','err')}};r.readAsText(file)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();$('#sheet').classList.remove('open')}
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();const q=prompt('🔍 ابحث:');if(q)runGlobalSearch(q)}
  if(e.code==='Space'&&FOCUS.on&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();FOCUS.pause()}
  if(e.key==='Enter'&&!e.shiftKey&&document.activeElement.id==='chat-txt'){e.preventDefault();const f=document.activeElement.closest('form');if(f)f.requestSubmit()}
});

function runGlobalSearch(q){
  q=q.toLowerCase().trim();if(!q)return;
  const res={lessons:[],tasks:[],notes:[]};
  S.subjects.forEach(s=>{s.lessons.forEach(l=>{if(l.t.toLowerCase().includes(q)||l.desc?.toLowerCase().includes(q)||l.summary?.toLowerCase().includes(q))res.lessons.push({s,l})})});
  S.tasks.forEach(t=>{if(t.title.toLowerCase().includes(q))res.tasks.push(t)});
  S.notes.forEach(n=>{if(n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q))res.notes.push(n)});
  const total=res.lessons.length+res.tasks.length+res.notes.length;
  let html=`<p class="vs" style="margin-bottom:12px">${total} نتيجة لـ «${esc(q)}»</p>`;
  if(res.lessons.length)html+=`<div class="hist-d">📖 الدروس</div>`+res.lessons.map(r=>`<button class="row" style="width:100%" data-act="open-lesson" data-id="${r.l.id}"><div class="r-t"><b>${esc(r.l.t)}</b><span>${r.s.emoji} ${esc(r.s.name)}</span></div></button>`).join('');
  if(res.tasks.length)html+=`<div class="hist-d">✅ المهام</div>`+res.tasks.map(t=>`<div class="row"><div class="r-t"><b>${esc(t.title)}</b></div></div>`).join('');
  if(res.notes.length)html+=`<div class="hist-d">📝 الملاحظات</div>`+res.notes.map(n=>`<div class="row"><div class="r-t"><b>${esc(n.title)}</b><span>${esc(n.body.slice(0,50))}</span></div></div>`).join('');
  if(!total)html=`<div class="empty"><div class="e-ic">🔍</div><b>لا نتائج</b></div>`;
  modal({title:'🔍 نتائج البحث',body:html});
}
