<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نخبة 2AS | منصة ذكية لطلاب تسيير واقتصاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0A192F;
  --navy-light: #112240;
  --emerald: #10B981;
  --emerald-dark: #059669;
  --sand: #F8FAFC;
  --text: #1E293B;
  --text-light: #64748B;
  --border: #E2E8F0;
  --shadow: 0 4px 6px -1px rgba(0,0,0,.1);
  --radius: 12px;
}

[data-theme="dark"] {
  --sand: #0F172A;
  --text: #F1F5F9;
  --text-light: #94A3B8;
  --border: #1E293B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans Arabic', 'Cairo', sans-serif;
  background: var(--sand);
  color: var(--text);
  line-height: 1.7;
  direction: rtl;
}

.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }

/* Sidebar */
.sidebar {
  background: var(--navy);
  color: white;
  padding: 1.5rem 1rem;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.logo {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 0 .75rem 1.5rem;
  border-bottom: 1px solid rgba(255,255,255,.1);
  margin-bottom: 1.5rem;
}

.logo-icon {
  width: 44px; height: 44px;
  background: var(--emerald);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.5rem; color: var(--navy);
}

.nav-item {
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1rem;
  margin-bottom: .25rem;
  border-radius: 10px;
  color: #CBD5E1;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  text-align: right;
  transition: all .2s;
}

.nav-item:hover { background: var(--navy-light); color: white; }
.nav-item.active { background: var(--emerald); color: var(--navy); font-weight: 700; }

/* Main */
.main { padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.page-title h2 {
  font-size: 2rem;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: .5rem;
}

[data-theme="dark"] .page-title h2 { color: white; }

/* Cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.25rem;
  margin-bottom: 2rem;
}

.card {
  background: white;
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: all .2s;
  cursor: pointer;
}

[data-theme="dark"] .card { background: var(--navy-light); }

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 25px -5px rgba(0,0,0,.1);
  border-color: var(--emerald);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.card-icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
  display: flex; align-items: center; justify-content: center;
  color: white;
  flex-shrink: 0;
}

.card h3 { font-size: 1.15rem; font-weight: 700; color: var(--navy); margin-bottom: .25rem; }
[data-theme="dark"] .card h3 { color: white; }

/* Buttons */
.btn {
  padding: .6rem 1.25rem;
  border-radius: 8px;
  font-weight: 600;
  font-size: .9rem;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  border: none;
  cursor: pointer;
}

.btn-primary { background: var(--emerald); color: white; }
.btn-primary:hover { background: var(--emerald-dark); }
.btn-secondary { background: var(--navy); color: white; }
.btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }

/* AI Chat */
.ai-container {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 70vh;
}

[data-theme="dark"] .ai-container { background: var(--navy-light); }

.ai-header {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  color: white;
  padding: 1.5rem;
  border-radius: var(--radius) var(--radius) 0 0;
  display: flex;
  align-items: center;
  gap: 1rem;
}

.ai-avatar {
  width: 50px; height: 50px;
  background: var(--emerald);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
}

.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.message {
  display: flex;
  gap: .75rem;
  max-width: 80%;
}

.message.user {
  flex-direction: row-reverse;
  align-self: flex-end;
}

.message-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1.25rem;
}

.message.ai .message-avatar { background: var(--emerald); color: white; }
.message.user .message-avatar { background: var(--navy); color: white; }

.message-content {
  background: var(--sand);
  padding: 1rem;
  border-radius: 12px;
  line-height: 1.6;
}

[data-theme="dark"] .message-content { background: var(--navy); }

.message.user .message-content { background: var(--emerald); color: white; }

.ai-input-area {
  padding: 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}

.ai-input-area textarea {
  flex: 1;
  min-height: 60px;
  padding: .75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  resize: vertical;
  font-family: inherit;
}

.image-preview {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  margin-bottom: .5rem;
}

.image-preview-item {
  position: relative;
  width: 80px; height: 80px;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid var(--border);
}

.image-preview-item img {
  width: 100%; height: 100%;
  object-fit: cover;
}

.image-preview-item .remove-btn {
  position: absolute;
  top: 2px; left: 2px;
  background: rgba(239,68,68,.9);
  color: white;
  border: none;
  border-radius: 50%;
  width: 20px; height: 20px;
  cursor: pointer;
  font-size: .75rem;
  display: flex; align-items: center; justify-content: center;
}

/* Schedule Tables */
.schedule-container {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 2rem;
}

[data-theme="dark"] .schedule-container { background: var(--navy-light); }

.schedule-header {
  background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
  color: white;
  padding: 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.schedule-table {
  width: 100%;
  border-collapse: collapse;
}

.schedule-table th {
  background: var(--navy);
  color: white;
  padding: 1rem;
  text-align: center;
  font-weight: 700;
}

.schedule-table td {
  padding: .75rem;
  border: 1px solid var(--border);
  text-align: center;
  min-width: 120px;
  vertical-align: middle;
}

.schedule-table tr:nth-child(even) { background: var(--sand); }
[data-theme="dark"] .schedule-table tr:nth-child(even) { background: var(--navy); }

.schedule-cell {
  cursor: pointer;
  transition: all .2s;
  padding: .5rem;
  border-radius: 6px;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .25rem;
}

.schedule-cell:hover { background: rgba(16,185,129,.1); }

.schedule-cell.filled {
  background: linear-gradient(135deg, rgba(16,185,129,.2), rgba(16,185,129,.1));
  border: 2px solid var(--emerald);
}

.schedule-cell .subject-name {
  font-weight: 700;
  font-size: .85rem;
  color: var(--navy);
}

[data-theme="dark"] .schedule-cell .subject-name { color: white; }

.schedule-cell .subject-time {
  font-size: .75rem;
  color: var(--text-light);
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}

.modal-overlay.show { display: flex; }

.modal {
  background: white;
  border-radius: var(--radius);
  max-width: 500px;
  width: 100%;
  padding: 1.5rem;
  max-height: 90vh;
  overflow-y: auto;
}

[data-theme="dark"] .modal { background: var(--navy-light); color: white; }

.modal h3 { margin-bottom: 1rem; color: var(--navy); }
[data-theme="dark"] .modal h3 { color: white; }

.form-group { margin-bottom: 1rem; }
.form-group label { display: block; margin-bottom: .5rem; font-weight: 600; }
.form-group input, .form-group select {
  width: 100%;
  padding: .75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: .75rem 1.5rem;
  border-radius: 10px;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,.2);
  z-index: 2000;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}

.toast.show { opacity: 1; }

/* Responsive */
@media (max-width: 968px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    right: 0; top: 0;
    width: 280px;
    z-index: 999;
    transform: translateX(100%);
    transition: transform .3s;
  }
  .sidebar.open { transform: translateX(0); }
  .main { padding: 1rem; }
  .schedule-table { font-size: .85rem; }
  .schedule-table td, .schedule-table th { padding: .5rem; min-width: 80px; }
}

.badge {
  display: inline-block;
  padding: .25rem .75rem;
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 600;
}

.badge-success { background: #D1FAE5; color: #065F46; }
.badge-warning { background: #FEF3C7; color: #92400E; }
.badge-info { background: #DBEAFE; color: #1E40AF; }

.lesson-section {
  background: white;
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

[data-theme="dark"] .lesson-section { background: var(--navy-light); }

.section-title {
  display: flex;
  align-items: center;
  gap: .75rem;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 1rem;
  padding-bottom: .75rem;
  border-bottom: 2px solid var(--emerald);
}

[data-theme="dark"] .section-title { color: white; }

.section-icon {
  width: 36px; height: 36px;
  background: var(--emerald);
  color: white;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.definition-box {
  background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
  border-right: 4px solid var(--emerald);
  padding: 1rem;
  border-radius: 8px;
  margin: 1rem 0;
}

[data-theme="dark"] .definition-box { background: rgba(16,185,129,.1); }

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">ن</div>
      <div>
        <h1 style="font-size: 1.1rem; font-weight: 800;">نخبة 2AS</h1>
        <p style="font-size: .75rem; color: #94A3B8;">منصة ذكية</p>
      </div>
    </div>

    <button class="nav-item active" data-route="home">🏠 الرئيسية</button>
    <button class="nav-item" data-route="ai">🤖 المساعد الذكي</button>
    <button class="nav-item" data-route="school">🏫 الجدول المدرسي</button>
    <button class="nav-item" data-route="home-schedule">🏠 الجدول المنزلي</button>
    <button class="nav-item" data-route="subjects">📚 المواد الدراسية</button>
    <button class="nav-item" data-route="dashboard">📊 لوحة التحكم</button>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <div class="topbar">
      <button class="btn btn-outline" onclick="toggleSidebar()" style="display: none;" id="menuBtn">☰</button>
      <div style="flex: 1;"></div>
      <button class="btn btn-outline" onclick="toggleTheme()">🌙</button>
    </div>

    <div id="content"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ==================== STATE ====================
const state = {
  currentRoute: 'home',
  theme: localStorage.getItem('theme') || 'light',
  schoolSchedule: JSON.parse(localStorage.getItem('schoolSchedule') || '{}'),
  homeSchedule: JSON.parse(localStorage.getItem('homeSchedule') || '{}'),
  aiMessages: JSON.parse(localStorage.getItem('aiMessages') || '[]'),
  uploadedImages: [],
  geminiApiKey: localStorage.getItem('geminiApiKey') || ''
};

document.documentElement.setAttribute('data-theme', state.theme);

// ==================== GEMINI AI INTEGRATION ====================

const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';

async function callGeminiAPI(prompt, images = []) {
  if (!state.geminiApiKey) {
    return { error: 'لم يتم إعداد مفتاح API. يرجى إدخال مفتاح Google Gemini API من الإعدادات.' };
  }

  const parts = [{ text: prompt }];

  // Add images if provided
  for (const img of images) {
    parts.push({
      inline_data: {
        mime_type: img.type,
        data: img.data
      }
    });
  }

  try {
    const response = await fetch(`${GEMINI_API_URL}?key=${state.geminiApiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts }],
        generationConfig: {
          temperature: 0.7,
          topK: 40,
          topP: 0.95,
          maxOutputTokens: 2048,
        }
      })
    });

    if (!response.ok) {
      const error = await response.json();
      return { error: `خطأ في API: ${error.error?.message || 'غير معروف'}` };
    }

    const data = await response.json();
    return { text: data.candidates[0].content.parts[0].text };
  } catch (err) {
    return { error: `خطأ في الاتصال: ${err.message}` };
  }
}

// ==================== ROUTING ====================

function navigate(route) {
  state.currentRoute = route;
  render();
  updateNav();
  window.scrollTo(0, 0);
  document.getElementById('sidebar').classList.remove('open');
}

function updateNav() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === state.currentRoute);
  });
}

// ==================== RENDERERS ====================

function render() {
  const content = document.getElementById('content');
  let html = '';

  switch (state.currentRoute) {
    case 'home': html = renderHome(); break;
    case 'ai': html = renderAI(); break;
    case 'school': html = renderSchoolSchedule(); break;
    case 'home-schedule': html = renderHomeSchedule(); break;
    case 'subjects': html = renderSubjects(); break;
    case 'dashboard': html = renderDashboard(); break;
    default: html = renderHome();
  }

  content.innerHTML = html;
  attachHandlers();
}

function renderHome() {
  return `
    <div class="page-title">
      <h2>مرحباً بك في نخبة 2AS 🎓</h2>
      <p>منصة تعليمية ذكية لطلاب السنة الثانية ثانوي - شعبة تسيير واقتصاد</p>
    </div>

    <div class="cards-grid">
      <div class="card" onclick="navigate('ai')">
        <div class="card-header">
          <div class="card-icon">🤖</div>
          <div>
            <h3>المساعد الذكي</h3>
            <p style="font-size: .85rem; color: var(--text-light);">مدعوم بـ Google Gemini</p>
          </div>
        </div>
        <p style="color: var(--text-light);">اطرح أسئلتك، احصل على ملخصات، وأرسل صور ملخصاتك للتحليل</p>
        <div style="margin-top: 1rem;">
          <span class="badge badge-success">✓ متاح الآن</span>
        </div>
      </div>

      <div class="card" onclick="navigate('school')">
        <div class="card-header">
          <div class="card-icon" style="background: linear-gradient(135deg, #3B82F6, #1E40AF);">🏫</div>
          <div>
            <h3>الجدول المدرسي</h3>
            <p style="font-size: .85rem; color: var(--text-light);">أوقات الحصص الأسبوعية</p>
          </div>
        </div>
        <p style="color: var(--text-light);">نظم أوقات حصصك المدرسية بسهولة</p>
      </div>

      <div class="card" onclick="navigate('home-schedule')">
        <div class="card-header">
          <div class="card-icon" style="background: linear-gradient(135deg, #8B5CF6, #6D28D9);">🏠</div>
          <div>
            <h3>الجدول المنزلي</h3>
            <p style="font-size: .85rem; color: var(--text-light);">أوقات المراجعة والدراسة</p>
          </div>
        </div>
        <p style="color: var(--text-light);">خطط مراجعاتك المنزلية بذكاء</p>
      </div>

      <div class="card" onclick="navigate('subjects')">
        <div class="card-header">
          <div class="card-icon" style="background: linear-gradient(135deg, #F59E0B, #D97706);">📚</div>
          <div>
            <h3>المواد الدراسية</h3>
            <p style="font-size: .85rem; color: var(--text-light);">10 مواد كاملة</p>
          </div>
        </div>
        <p style="color: var(--text-light);">دروس، تمارين، وفيديوهات لجميع المواد</p>
      </div>
    </div>

    <div class="lesson-section">
      <div class="section-title">
        <div class="section-icon">💡</div>
        نصائح للدراسة الفعالة
      </div>
      <ul style="padding-right: 1.5rem; line-height: 2;">
        <li><strong>استخدم المساعد الذكي:</strong> اطلب منه تلخيص الدروس الصعبة أو شرح المفاهيم</li>
        <li><strong>ارسل صور ملخصاتك:</strong> سيساعدك في تحسينها وإضافة النقاط الناقصة</li>
        <li><strong>نظم وقتك:</strong> استخدم الجدولين المدرسي والمنزلي للتخطيط</li>
        <li><strong>المراجعة المنتظمة:</strong> راجع دروسك يومياً ولو لمدة 30 دقيقة</li>
        <li><strong>حل التمارين:</strong> التطبيق العملي أهم من القراءة فقط</li>
      </ul>
    </div>
  `;
}

function renderAI() {
  return `
    <div class="page-title">
      <h2>🤖 المساعد الذكي</h2>
      <p>مدعوم بـ Google Gemini AI - اسأل أي سؤال أو أرسل صور ملخصاتك</p>
    </div>

    ${!state.geminiApiKey ? `
      <div class="lesson-section" style="background: #FEF3C7; border-right: 4px solid #F59E0B;">
        <h3 style="color: #92400E; margin-bottom: .5rem;">⚠️ إعداد مطلوب</h3>
        <p style="color: #78350F; margin-bottom: 1rem;">
          لاستخدام المساعد الذكي، تحتاج إلى مفتاح Google Gemini API (مجاني).
        </p>
        <button class="btn btn-primary" onclick="showApiSetup()">🔑 إعداد مفتاح API</button>
        <p style="font-size: .85rem; color: var(--text-light); margin-top: 1rem;">
          احصل على مفتاح مجاني من: <a href="https://makersuite.google.com/app/apikey" target="_blank" style="color: var(--emerald);">Google AI Studio</a>
        </p>
      </div>
    ` : ''}

    <div class="ai-container">
      <div class="ai-header">
        <div class="ai-avatar">🤖</div>
        <div>
          <h3 style="margin: 0;">مساعد نخبة الذكي</h3>
          <p style="font-size: .85rem; color: #94A3B8; margin: 0;">مدعوم بـ Google Gemini 1.5 Flash</p>
        </div>
        <button class="btn btn-outline" style="margin-right: auto; background: rgba(255,255,255,.1); color: white; border-color: rgba(255,255,255,.2);" onclick="clearChat()">🗑 مسح المحادثة</button>

// ==================== AI FUNCTIONS ====================

async function sendMessage() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  
  if (!text && state.uploadedImages.length === 0) {
    showToast('اكتب رسالة أو أرفق صورة');
    return;
  }

  if (!state.geminiApiKey) {
    showToast('يرجى إعداد مفتاح API أولاً');
    navigate('dashboard');
    return;
  }

  // Add user message
  const userMsg = {
    role: 'user',
    text: text || 'حلل هذه الصورة',
    images: state.uploadedImages,
    timestamp: Date.now()
  };
  state.aiMessages.push(userMsg);
  
  input.value = '';
  state.uploadedImages = [];
  render();

  // Scroll to bottom
  const messages = document.getElementById('aiMessages');
  messages.scrollTop = messages.scrollHeight;

  // Show loading
  const loadingId = 'loading-' + Date.now();
  messages.innerHTML += `
    <div class="message ai" id="${loadingId}">
      <div class="message-avatar">🤖</div>
      <div class="message-content">
        <div class="loading"></div> جاري التفكير...
      </div>
    </div>
  `;
  messages.scrollTop = messages.scrollHeight;

  // Build prompt
  let prompt = `أنت مساعد تعليمي ذكي لطلاب السنة الثانية ثانوي في الجزائر (شعبة تسيير واقتصاد). أجب باللغة العربية بوضوح ودقة.\n\n`;
  
  if (userMsg.images && userMsg.images.length > 0) {
    prompt += `حلل هذه الصورة/الملخص وأعطِ:\n1. ملخص لما تحتويه\n2. نقاط القوة\n3. نقاط يمكن تحسينها\n4. إضافات مقترحة\n\n`;
  }
  
  if (text) {
    prompt += `سؤال الطالب: ${text}`;
  }

  // Call API
  const response = await callGeminiAPI(prompt, state.uploadedImages.map((img, idx) => {
    const base64 = img.split(',')[1];
    const type = img.split(';')[0].split(':')[1];
    return { data: base64, type };
  }));

  // Remove loading
  document.getElementById(loadingId)?.remove();

  // Add AI response
  const aiMsg = {
    role: 'ai',
    text: response.error || response.text,
    timestamp: Date.now()
  };
  state.aiMessages.push(aiMsg);
  saveMessages();
  render();
}

function handleImageUpload(event) {
  const files = event.target.files;
  
  for (const file of files) {
    if (file.size > 5 * 1024 * 1024) {
      showToast('حجم الصورة كبير جداً (الحد الأقصى 5MB)');
      continue;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      state.uploadedImages.push(e.target.result);
      renderImagePreview();
    };
    reader.readAsDataURL(file);
  }
}

function renderImagePreview() {
  const preview = document.getElementById('imagePreview');
  preview.innerHTML = state.uploadedImages.map((img, idx) => `
    <div class="image-preview-item">
      <img src="${img}">
      <button class="remove-btn" onclick="removeImage(${idx})">×</button>
    </div>
  `).join('');
}

function removeImage(idx) {
  state.uploadedImages.splice(idx, 1);
  renderImagePreview();
}

function clearChat() {
  if (confirm('هل تريد مسح جميع الرسائل؟')) {
    state.aiMessages = [];
    saveMessages();
    render();
  }
}

function askAIAbout(subject) {
  navigate('ai');
  setTimeout(() => {
    const input = document.getElementById('aiInput');
    input.value = `اشرح لي أهم المفاهيم في مادة ${subject} للسنة الثانية ثانوي`;

// ==================== SCHEDULE FUNCTIONS ====================

function editScheduleCell(type, key, day, time) {
  const schedule = type === 'school' ? state.schoolSchedule : state.homeSchedule;
  const current = schedule[key];

  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');

  content.innerHTML = `
    <h3>${type === 'school' ? '🏫' : '🏠'} ${current ? 'تعديل' : 'إضافة'} - ${day} ${time}</h3>
    <div class="form-group">
      <label>${type === 'school' ? 'المادة' : 'المادة/النشاط'}</label>
      <input type="text" id="cellSubject" value="${current?.subject || ''}" placeholder="مثال: الرياضيات">
    </div>
    <div class="form-group">
      <label>${type === 'school' ? 'رقم القاعة' : 'المهمة'}</label>
      <input type="text" id="cellDetail" value="${current?.room || current?.task || ''}" placeholder="${type === 'school' ? 'قاعة 3' : 'حل تمارين'}">
    </div>
    <div style="display: flex; gap: .5rem; margin-top: 1rem;">
      <button class="btn btn-primary" onclick="saveScheduleCell('${type}', '${key}')">💾 حفظ</button>
      ${current ? `<button class="btn btn-outline" onclick="deleteScheduleCell('${type}', '${key}')" style="background: #EF4444; color: white; border-color: #EF4444;">🗑 حذف</button>` : ''}
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    </div>
  `;

  modal.classList.add('show');
}

function saveScheduleCell(type, key) {
  const subject = document.getElementById('cellSubject').value.trim();
  const detail = document.getElementById('cellDetail').value.trim();

  if (!subject) {
    showToast('يرجى إدخال اسم المادة');
    return;
  }

  const schedule = type === 'school' ? state.schoolSchedule : state.homeSchedule;
  schedule[key] = {
    subject,
    [type === 'school' ? 'room' : 'task']: detail
  };

  localStorage.setItem(`${type}Schedule`, JSON.stringify(schedule));
  closeModal();
  render();
  showToast('✓ تم الحفظ');
}

function deleteScheduleCell(type, key) {
  const schedule = type === 'school' ? state.schoolSchedule : state.homeSchedule;
  delete schedule[key];
  localStorage.setItem(`${type}Schedule`, JSON.stringify(schedule));
  closeModal();
  render();
  showToast('✓ تم الحذف');
}

function exportSchedule(type) {
  showToast('📥 جاري التصدير... (ميزة قيد التطوير)');
}

// ==================== UTILITY FUNCTIONS ====================

function saveMessages() {
  localStorage.setItem('aiMessages', JSON.stringify(state.aiMessages));
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  state.geminiApiKey = key;
  localStorage.setItem('geminiApiKey', key);
  showToast('✓ تم حفظ المفتاح');
}

function showApiSetup() {
  navigate('dashboard');
}

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  localStorage.setItem('theme', state.theme);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function exportData() {
  const data = {
    schoolSchedule: state.schoolSchedule,
    homeSchedule: state.homeSchedule,
    aiMessages: state.aiMessages,
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nokhba-backup-${Date.now()}.json`;
  a.click();
  showToast('✓ تم التصدير');
}

function clearAllData() {
  if (confirm('هل أنت متأكد؟ سيتم حذف جميع بياناتك!')) {
    localStorage.clear();
    location.reload();
  }
}

function attachHandlers() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.onclick = () => navigate(el.dataset.route);
  });

  // Auto-scroll AI messages
  const messages = document.getElementById('aiMessages');
  if (messages) {
    messages.scrollTop = messages.scrollHeight;
  }
}

// Initial render
render();

// Responsive menu
if (window.innerWidth <= 968) {
  document.getElementById('menuBtn').style.display = 'block';
}

window.addEventListener('resize', () => {
  document.getElementById('menuBtn').style.display = window.innerWidth <= 968 ? 'block' : 'none';
